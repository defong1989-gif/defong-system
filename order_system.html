<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>訂單系統</title>
    <style>
        :root {
            --primary-color: #2563eb;
            --primary-hover: #1d4ed8;
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-color: #1e293b;
            --border-color: #e2e8f0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 900px;
            background: var(--card-bg);
            padding: 24px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid var(--border-color);
            padding-bottom: 16px;
            margin-bottom: 24px;
        }

        .header h1 {
            margin: 0;
            font-size: 1.5rem;
            color: var(--text-color);
        }

        .btn-switch-system {
            background-color: var(--primary-color);
            color: white;
            padding: 8px 16px;
            text-decoration: none;
            border-radius: 6px;
            font-weight: bold;
            font-size: 0.9rem;
            transition: background-color 0.2s ease;
        }

        .btn-switch-system:hover {
            background-color: var(--primary-hover);
        }

        .content {
            padding: 10px 0;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- 頂部導覽列：包含系統名稱與切換按鈕 -->
        <div class="header">
            <h1>📋 訂單系統</h1>
            <a href="yarn_system.html" class="btn-switch-system">📦 切換至紗帳系統 ➔</a>
        </div>

        <!-- 系統主體內容區域 -->
        <div class="content">
            <p>歡迎使用訂單系統！您可以在此管理所有的訂單項目。</p>
            <!-- 您的訂單系統主要功能區域請放置於此 -->
        </div>
    </div>

</body>
</html>
