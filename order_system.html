<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>德峰訂單管理系統 (庫存連動版)</title>
    <!-- 載入 SheetJS 以支援 Excel 匯出 -->
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <style>
        :root {
            --primary: #4f46e5;       /* 靛藍色主題 (區隔紗帳系統) */
            --primary-light: #6366f1;
            --primary-hover: #4338ca;
            --success: #10b981;
            --success-hover: #059669;
            --danger: #ef4444;
            --danger-hover: #dc2626;
            --excel: #16a34a;
            --excel-hover: #15803d;
            --bg: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #0f172a;
            --text-sub: #475569;
            --border: #cbd5e1;
        }

        * {
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }

        body {
            background-color: var(--bg);
            color: var(--text-main);
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        /* 頂部主題列與跳轉按鈕 */
        .header {
            background: linear-gradient(135deg, var(--primary), var(--primary-light));
            color: white;
            padding: 16px 32px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .header h1 {
            margin: 0;
            font-size: 1.5rem;
            font-weight: 700;
            letter-spacing: 1px;
        }

        .status-badge {
            background-color: #d1fae5;
            color: #065f46;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
        }

        /* 跨系統頁面跳轉按鈕 */
        .btn-switch-system {
            background-color: rgba(255, 255, 255, 0.2);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.5);
            padding: 8px 16px;
            border-radius: 8px;
            font-size: 0.9rem;
            font-weight: 600;
            text-decoration: none;
            transition: all 0.2s ease;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .btn-switch-system:hover {
            background-color: white;
            color: var(--primary);
            box-shadow: 0 2px 8px rgba(0,0,0,0.15);
        }

        /* 主要內容雙欄區域 */
        .main-container {
            padding: 20px 24px;
            display: grid;
            grid-template-columns: 420px minmax(0, 1fr);
            gap: 20px;
            align-items: start;
        }

        @media (max-width: 1100px) {
            .main-container {
                grid-template-columns: 1fr;
            }
        }

        .card {
            background: var(--card-bg);
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05), 0 2px 4px -1px rgba(0,0,0,0.03);
            border: 1px solid rgba(226, 232, 240, 0.8);
            margin-bottom: 20px;
            width: 100%;
        }

        .card-title {
            margin-top: 0;
            margin-bottom: 16px;
            color: var(--primary);
            font-size: 1.15rem;
            font-weight: 700;
            padding-bottom: 8px;
            border-bottom: 2px solid #f1f5f9;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 12px;
            margin-bottom: 20px;
            width: 100%;
        }

        .full-width {
            grid-column: span 2;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
            width: 100%;
        }

        label {
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text-sub);
        }

        input, select, textarea {
            width: 100%;
            padding: 9px 11px;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 0.9rem;
            outline: none;
            transition: all 0.2s;
            background-color: #f8fafc;
            box-sizing: border-box;
        }

        input:focus, select:focus, textarea:focus {
            border-color: var(--primary-light);
            background-color: #fff;
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.15);
        }

        /* 庫存提示區域 */
        .stock-info-card {
            background-color: #f0fdf4;
            border: 1px solid #bbf7d0;
            border-radius: 8px;
            padding: 12px;
            margin-bottom: 12px;
            width: 100%;
            box-sizing: border-box;
        }

        .stock-info-header {
            font-weight: 700;
            color: #166534;
            font-size: 0.9rem;
            margin-bottom: 6px;
            display: flex;
            justify-content: space-between;
        }

        .stock-detail-list {
            font-size: 0.85rem;
            color: #15803d;
            max-height: 120px;
            overflow-y: auto;
            margin: 0;
            padding-left: 18px;
        }

        .btn-group {
            display: flex;
            gap: 10px;
            width: 100%;
        }

        button {
            padding: 10px 18px;
            border: none;
            border-radius: 8px;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        .btn-primary { background-color: var(--primary-light); color: white; }
        .btn-primary:hover { background-color: var(--primary-hover); }

        .btn-success { background-color: var(--success); color: white; width: 100%; }
        .btn-success:hover { background-color: var(--success-hover); }

        .btn-excel { background-color: var(--excel); color: white; white-space: nowrap; }
        .btn-excel:hover { background-color: var(--excel-hover); }

        .btn-danger { background-color: var(--danger); color: white; padding: 4px 8px; font-size: 0.85rem; }
        .btn-danger:hover { background-color: var(--danger-hover); }

        .right-column {
            display: flex;
            flex-direction: column;
            gap: 20px;
            min-width: 0;
        }

        /* 篩選區 */
        .filter-grid {
            display: grid;
            grid-template-columns: 1fr 1fr auto;
            gap: 12px;
            align-items: end;
            margin-bottom: 16px;
        }

        @media (max-width: 768px) {
            .filter-grid { grid-template-columns: 1fr; }
        }

        .table-responsive {
            width: 100%;
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: separate;
            border-spacing: 0;
            text-align: left;
            font-size: 0.9rem;
        }

        th {
            background-color: #f8fafc;
            color: var(--text-sub);
            font-weight: 600;
            padding: 10px 12px;
            border-bottom: 2px solid var(--border);
            white-space: nowrap;
        }

        td {
            padding: 10px 12px;
            border-bottom: 1px solid var(--border);
            color: var(--text-main);
            vertical-align: middle;
        }

        tbody tr:hover { background-color: #f8fafc; }

        .img-preview {
            width: 50px;
            height: 50px;
            object-fit: cover;
            border-radius: 6px;
            cursor: pointer;
            border: 1px solid var(--border);
        }

        .no-data { text-align: center; color: #94a3b8; padding: 32px; }

        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0; top: 0;
            width: 100%; height: 100%;
            background-color: rgba(0,0,0,0.8);
            justify-content: center;
            align-items: center;
        }

        .modal-content {
            max-width: 90%;
            max-height: 90%;
            border-radius: 8px;
        }
    </style>
</head>
<body>

<div class="header">
    <div class="header-left">
        <h1>📋 德峰客戶訂單管理系統</h1>
        <span class="status-badge">🟢 雲端連線中</span>
    </div>
    <!-- 頁面跳轉按鈕 (指向紗帳系統) -->
    <a href="yarn_system.html" class="btn-switch-system">📦 切換至紗帳系統 ➔</a>
</div>

<div class="main-container">

    <!-- 【左側】訂單輸入表單 -->
    <div class="card">
        <h2 class="card-title" id="formTitle">📝 新增客戶訂單</h2>
        <form id="orderForm">
            <input type="hidden" id="editKey" value="">
            <input type="hidden" id="imageDataBase64" value="">

            <div class="form-grid">
                
                <!-- 客戶名稱：輸入框 + datalist 自動下拉選擇 -->
                <div class="form-group full-width">
                    <label for="customerName">客戶名稱 (可點擊選擇歷史客戶或直接輸入)</label>
                    <input type="text" id="customerName" list="customerDatalist" required placeholder="點選展開選單或直接輸入..." oninput="updateStockSummary()" onfocus="this.select()">
                    <datalist id="customerDatalist">
                        <!-- 由 JavaScript 自動動態載入歷史客戶清單 -->
                    </datalist>
                </div>

                <!-- 庫存紗連動即時提示區域 -->
                <div class="full-width stock-info-card" id="stockSummaryBox">
                    <div class="stock-info-header">
                        <span>📦 客戶紗帳庫存狀態</span>
                        <span id="stockTotalText">共 0 kg</span>
                    </div>
                    <ul class="stock-detail-list" id="stockDetailList">
                        <li>請輸入或選擇客戶名稱...</li>
                    </ul>
                </div>

                <div class="form-group">
                    <label for="orderDate">下單日期</label>
                    <input type="date" id="orderDate" required>
                </div>

                <div class="form-group">
                    <label for="dueDate">交期日期</label>
                    <input type="date" id="dueDate" required>
                </div>

                <div class="form-group full-width">
                    <label for="fabricType">布種</label>
                    <input type="text" id="fabricType" required placeholder="例如：單面平織布、雙面布">
                </div>

                <div class="form-group">
                    <label for="widthWeight">幅寬 / 碼重</label>
                    <input type="text" id="widthWeight" placeholder="例如：60吋 / 220g">
                </div>

                <div class="form-group">
                    <label for="quantity">訂單數量</label>
                    <input type="text" id="quantity" required placeholder="例如：1000 碼 / 500 kg">
                </div>

                <div class="form-group">
                    <label for="machineInch">機台吋數</label>
                    <input type="text" id="machineInch" placeholder="例如：30 吋">
                </div>

                <div class="form-group">
                    <label for="machineGauge">機台針數</label>
                    <input type="text" id="machineGauge" placeholder="例如：24 針">
                </div>

                <!-- 口數下拉選擇 -->
                <div class="form-group full-width">
                    <label for="feederSelect">口數</label>
                    <select id="feederSelect" onchange="onFeederSelectChange()">
                        <option value="">-- 請選擇口數 --</option>
                        <option value="60">60 口</option>
                        <option value="88">88 口</option>
                        <option value="90">90 口</option>
                        <option value="96">96 口</option>
                        <option value="108">108 口</option>
                        <option value="120">120 口</option>
                        <option value="custom">其他（自訂）</option>
                    </select>
                </div>

                <!-- 口數自訂輸入框 (預設隱藏) -->
                <div class="form-group full-width" id="customFeederGroup" style="display: none;">
                    <label for="feederCount">自訂口數</label>
                    <input type="text" id="feederCount" placeholder="請輸入口數">
                </div>

                <div class="form-group full-width">
                    <label for="yarnType">紗種</label>
                    <input type="text" id="yarnType" required placeholder="例如：30s 精梳棉 + 70D 彈性纖維">
                </div>

                <div class="form-group full-width">
                    <label for="yarnRatio">紗比例</label>
                    <input type="text" id="yarnRatio" placeholder="例如：棉 95% / 彈性纖維 5%">
                </div>

                <div class="form-group">
                    <label for="dyeingFactory">染整廠</label>
                    <input type="text" id="dyeingFactory" placeholder="例如：立揚、遠東">
                </div>

                <div class="form-group">
                    <label for="targetColor">要染的顏色</label>
                    <input type="text" id="targetColor" placeholder="例如：黑色、藏青色">
                </div>

                <div class="form-group full-width">
                    <label for="processingFee">工繳 (單價/總價)</label>
                    <input type="text" id="processingFee" placeholder="例如：$25/碼 或 總計 $50,000">
                </div>

                <div class="form-group full-width">
                    <label for="orderImage">上傳訂單照片 / 單據</label>
                    <input type="file" id="orderImage" accept="image/*" onchange="handleImageUpload(event)">
                    <div id="imageUploadStatus" style="font-size:0.8rem; color:var(--text-sub); margin-top:4px;"></div>
                </div>

            </div>

            <div class="btn-group">
                <button type="submit" class="btn-success" id="saveBtn">儲存訂單至雲端</button>
                <button type="button" class="btn-primary" id="cancelBtn" style="display:none; background-color: #64748b;" onclick="resetForm()">取消修改</button>
            </div>
        </form>
    </div>

    <!-- 【右側】資料列表區 -->
    <div class="right-column">
        
        <div class="card">
            <h2 class="card-title">🔍 訂單快速查詢與篩選</h2>
            <div class="filter-grid">
                <div class="form-group">
                    <label for="filterCustomer">依客戶篩選</label>
                    <select id="filterCustomer" onchange="renderTable()">
                        <option value="">-- 全部客戶 --</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="filterKeyword">關鍵字搜尋</label>
                    <input type="text" id="filterKeyword" placeholder="搜尋布種、顏色、紗種..." oninput="renderTable()">
                </div>
                <div>
                    <button class="btn-excel" onclick="exportOrdersToExcel()">📄 匯出 Excel 訂單報表</button>
                </div>
            </div>
        </div>

        <div class="card">
            <h2 class="card-title">📊 客戶訂單紀錄清單</h2>
            <div class="table-responsive">
                <table>
                    <thead>
                        <tr>
                            <th>照片</th>
                            <th>交期</th>
                            <th>客戶</th>
                            <th>布種</th>
                            <th>幅寬/碼重</th>
                            <th>數量</th>
                            <th>機台(吋/針/口)</th>
                            <th>紗種與比例</th>
                            <th>染廠/顏色</th>
                            <th>工繳</th>
                            <th>庫存連動狀態</th>
                            <th>操作</th>
                        </tr>
                    </thead>
                    <tbody id="orderTableBody">
                        <tr><td colspan="12" class="no-data">載入訂單資料中...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>

    </div>

</div>

<!-- 圖片放大 Modal -->
<div id="imageModal" class="modal" onclick="closeModal()">
    <img id="modalImg" class="modal-content" src="">
</div>

<!-- Firebase 模組 -->
<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, push, set, remove, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const firebaseConfig = {
        apiKey: "AIzaSyAR1sHUr3Yx6z2-EdPxvnKk50X4XL0-wR4",
        authDomain: "defong-ab039.firebaseapp.com",
        databaseURL: "https://defong-ab039-default-rtdb.firebaseio.com",
        projectId: "defong-ab039",
        storageBucket: "defong-ab039.firebasestorage.app",
        messagingSenderId: "751338216702",
        appId: "1:751338216702:web:1892c102b6565c8543d9af",
        measurementId: "G-ZTV82ZDYSV"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    
    const yarnRef = ref(db, 'yarnRecords');   
    const orderRef = ref(db, 'orderRecords'); 

    let yarnDataMap = {};
    let orderDataMap = {};
    let currentRenderedOrders = [];

    window.onload = function() {
        document.getElementById("orderDate").valueAsDate = new Date();
    };

    onValue(yarnRef, (snapshot) => {
        yarnDataMap = snapshot.val() || {};
        updateCustomerDropdowns();
        updateStockSummary();
        renderTable();
    });

    onValue(orderRef, (snapshot) => {
        orderDataMap = snapshot.val() || {};
        updateCustomerDropdowns();
        renderTable();
    });

    // 動態更新 Datalist 清單與右側篩選下拉選單
    function updateCustomerDropdowns() {
        const customers = new Set();
        Object.values(yarnDataMap).forEach(i => i.customerName && customers.add(i.customerName.trim()));
        Object.values(orderDataMap).forEach(i => i.customerName && customers.add(i.customerName.trim()));

        const sortedCustomers = Array.from(customers).sort();

        // 1. 更新輸入框的 Datalist 歷史選單
        const datalist = document.getElementById("customerDatalist");
        datalist.innerHTML = "";
        sortedCustomers.forEach(c => {
            const opt = document.createElement("option");
            opt.value = c;
            datalist.appendChild(opt);
        });

        // 2. 更新右側篩選下拉選單
        const filterSelect = document.getElementById("filterCustomer");
        const currentVal = filterSelect.value;
        filterSelect.innerHTML = '<option value="">-- 全部客戶 --</option>';
        sortedCustomers.forEach(c => {
            const opt = document.createElement("option");
            opt.value = c;
            opt.textContent = c;
            filterSelect.appendChild(opt);
        });
        filterSelect.value = currentVal;
    }

    // 口數下拉選擇與自訂轉換
    window.onFeederSelectChange = function() {
        const val = document.getElementById("feederSelect").value;
        const customGroup = document.getElementById("customFeederGroup");
        const feederInput = document.getElementById("feederCount");

        if (val === "custom") {
            customGroup.style.display = "flex";
            feederInput.value = "";
            feederInput.focus();
        } else {
            customGroup.style.display = "none";
            feederInput.value = val;
        }
    };

    // 即時計算與更新該客戶的紗帳庫存
    window.updateStockSummary = function() {
        const custName = document.getElementById("customerName").value.trim();
        const totalText = document.getElementById("stockTotalText");
        const detailList = document.getElementById("stockDetailList");

        if (!custName) {
            totalText.innerText = "共 0 kg";
            detailList.innerHTML = "<li>請輸入或選擇客戶名稱...</li>";
            return;
        }

        let totalWeight = 0;
        let totalBox = 0;
        const yarnSummary = {};

        Object.values(yarnDataMap).forEach(item => {
            if (item.customerName && item.customerName.trim() === custName) {
                const w = parseFloat(item.yarnWeight) || 0;
                const pkg = parseFloat(item.packageCount) || 0;
                const box = item.boxCount !== undefined ? parseFloat(item.boxCount) : (pkg * 4);

                totalWeight += w;
                totalBox += box;

                const yType = item.yarnType || "未標示紗種";
                if (!yarnSummary[yType]) {
                    yarnSummary[yType] = { weight: 0, box: 0 };
                }
                yarnSummary[yType].weight += w;
                yarnSummary[yType].box += box;
            }
        });

        if (Object.keys(yarnSummary).length === 0) {
            totalText.innerText = "尚無紗帳紀錄";
            detailList.innerHTML = `<li style="color:#c2410c;">⚠️ 紗帳系統中查無「${custName}」的進紗資料</li>`;
        } else {
            totalText.innerText = `總庫存：${totalWeight.toFixed(2)} kg (${totalBox.toFixed(1)} 箱)`;
            detailList.innerHTML = "";
            Object.keys(yarnSummary).forEach(yName => {
                const li = document.createElement("li");
                li.innerHTML = `<strong>${yName}</strong>: ${yarnSummary[yName].weight.toFixed(2)} kg (${yarnSummary[yName].box.toFixed(1)} 箱)`;
                detailList.appendChild(li);
            });
        }
    };

    // 處理圖片上傳
    window.handleImageUpload = function(event) {
        const file = event.target.files[0];
        const statusDiv = document.getElementById("imageUploadStatus");
        if (!file) return;

        statusDiv.innerText = "⏳ 圖片處理中...";

        const reader = new FileReader();
        reader.onload = function(e) {
            const img = new Image();
            img.onload = function() {
                const canvas = document.createElement("canvas");
                const MAX_WIDTH = 1000;
                let width = img.width;
                let height = img.height;

                if (width > MAX_WIDTH) {
                    height *= MAX_WIDTH / width;
                    width = MAX_WIDTH;
                }

                canvas.width = width;
                canvas.height = height;
                const ctx = canvas.getContext("2d");
                ctx.drawImage(img, 0, 0, width, height);

                const base64Str = canvas.toDataURL("image/jpeg", 0.7);
                document.getElementById("imageDataBase64").value = base64Str;
                statusDiv.innerText = "✅ 照片處理完成";
            };
            img.src = e.target.result;
        };
        reader.readAsDataURL(file);
    };

    // 渲染表格
    window.renderTable = function() {
        const selectedCustomer = document.getElementById("filterCustomer").value;
        const keyword = document.getElementById("filterKeyword").value.toLowerCase().trim();
        const tbody = document.getElementById("orderTableBody");
        tbody.innerHTML = "";

        const keys = Object.keys(orderDataMap);
        currentRenderedOrders = [];

        keys.forEach(key => {
            const item = orderDataMap[key];
            const matchCustomer = !selectedCustomer || item.customerName === selectedCustomer;
            const matchKeyword = !keyword ||
                item.customerName.toLowerCase().includes(keyword) ||
                item.fabricType.toLowerCase().includes(keyword) ||
                (item.yarnType && item.yarnType.toLowerCase().includes(keyword)) ||
                (item.targetColor && item.targetColor.toLowerCase().includes(keyword)) ||
                (item.dyeingFactory && item.dyeingFactory.toLowerCase().includes(keyword));

            if (matchCustomer && matchKeyword) {
                currentRenderedOrders.push({ key, ...item });
            }
        });

        currentRenderedOrders.sort((a,b) => new Date(a.dueDate) - new Date(b.dueDate));

        if (currentRenderedOrders.length === 0) {
            tbody.innerHTML = '<tr><td colspan="12" class="no-data">目前無符合條件的訂單資料</td></tr>';
            return;
        }

        currentRenderedOrders.forEach(item => {
            let custTotalWeight = 0;
            Object.values(yarnDataMap).forEach(y => {
                if (y.customerName && y.customerName.trim() === item.customerName.trim()) {
                    custTotalWeight += parseFloat(y.yarnWeight) || 0;
                }
            });

            const stockText = custTotalWeight > 0 
                ? `<span style="color:#15803d; font-weight:600;">🟢 紗庫存 ${custTotalWeight.toFixed(1)} kg</span>`
                : `<span style="color:#dc2626; font-weight:600;">🔴 無庫存紗</span>`;

            const imgHtml = item.image 
                ? `<img src="${item.image}" class="img-preview" onclick="openModal('${item.image}')">`
                : `<span style="color:#94a3b8;">無照片</span>`;

            const row = document.createElement("tr");
            row.innerHTML = `
                <td>${imgHtml}</td>
                <td><strong>${item.dueDate || "-"}</strong></td>
                <td><strong>${item.customerName}</strong></td>
                <td>${item.fabricType}</td>
                <td>${item.widthWeight || "-"}</td>
                <td>${item.quantity}</td>
                <td>${item.machineInch || "-"}吋 / ${item.machineGauge || "-"}針 / ${item.feederCount || "-"}口</td>
                <td>${item.yarnType}<br><small style="color:var(--text-sub);">${item.yarnRatio || ""}</small></td>
                <td>${item.dyeingFactory || "-"}<br><small style="color:var(--primary);">${item.targetColor || ""}</small></td>
                <td>${item.processingFee || "-"}</td>
                <td>${stockText}</td>
                <td>
                    <button class="btn-primary" style="padding: 4px 8px; font-size: 0.85rem;" onclick="editOrder('${item.key}')">編輯</button>
                    <button class="btn-danger" onclick="deleteOrder('${item.key}')">刪除</button>
                </td>
            `;
            tbody.appendChild(row);
        });
    };

    // 儲存表單
    document.getElementById("orderForm").addEventListener("submit", function(e) {
        e.preventDefault();

        const editKey = document.getElementById("editKey").value;
        const feederVal = document.getElementById("feederCount").value.trim();

        const orderData = {
            customerName: document.getElementById("customerName").value.trim(),
            orderDate: document.getElementById("orderDate").value,
            dueDate: document.getElementById("dueDate").value,
            fabricType: document.getElementById("fabricType").value.trim(),
            widthWeight: document.getElementById("widthWeight").value.trim(),
            quantity: document.getElementById("quantity").value.trim(),
            machineInch: document.getElementById("machineInch").value.trim(),
            machineGauge: document.getElementById("machineGauge").value.trim(),
            feederCount: feederVal,
            yarnType: document.getElementById("yarnType").value.trim(),
            yarnRatio: document.getElementById("yarnRatio").value.trim(),
            dyeingFactory: document.getElementById("dyeingFactory").value.trim(),
            targetColor: document.getElementById("targetColor").value.trim(),
            processingFee: document.getElementById("processingFee").value.trim(),
            image: document.getElementById("imageDataBase64").value || ""
        };

        if (!editKey) {
            push(orderRef, orderData);
        } else {
            set(ref(db, `orderRecords/${editKey}`), orderData);
        }

        resetForm();
    });

    window.editOrder = function(key) {
        const item = orderDataMap[key];
        document.getElementById("editKey").value = key;
        document.getElementById("customerName").value = item.customerName;
        document.getElementById("orderDate").value = item.orderDate;
        document.getElementById("dueDate").value = item.dueDate;
        document.getElementById("fabricType").value = item.fabricType;
        document.getElementById("widthWeight").value = item.widthWeight || "";
        document.getElementById("quantity").value = item.quantity;
        document.getElementById("machineInch").value = item.machineInch || "";
        document.getElementById("machineGauge").value = item.machineGauge || "";

        const stdFeeders = ["60", "88", "90", "96", "108", "120"];
        if (stdFeeders.includes(item.feederCount)) {
            document.getElementById("feederSelect").value = item.feederCount;
            document.getElementById("customFeederGroup").style.display = "none";
        } else if (item.feederCount) {
            document.getElementById("feederSelect").value = "custom";
            document.getElementById("customFeederGroup").style.display = "flex";
        } else {
            document.getElementById("feederSelect").value = "";
            document.getElementById("customFeederGroup").style.display = "none";
        }
        document.getElementById("feederCount").value = item.feederCount || "";

        document.getElementById("yarnType").value = item.yarnType;
        document.getElementById("yarnRatio").value = item.yarnRatio || "";
        document.getElementById("dyeingFactory").value = item.dyeingFactory || "";
        document.getElementById("targetColor").value = item.targetColor || "";
        document.getElementById("processingFee").value = item.processingFee || "";
        document.getElementById("imageDataBase64").value = item.image || "";

        document.getElementById("formTitle").innerText = "✏️ 編輯客戶訂單";
        document.getElementById("saveBtn").innerText = "更新訂單資料";
        document.getElementById("cancelBtn").style.display = "inline-flex";

        updateStockSummary();
        window.scrollTo({ top: 0, behavior: 'smooth' });
    };

    window.deleteOrder = function(key) {
        if (confirm("確定要刪除這筆訂單紀錄嗎？")) {
            remove(ref(db, `orderRecords/${key}`));
        }
    };

    window.resetForm = function() {
        document.getElementById("orderForm").reset();
        document.getElementById("editKey").value = "";
        document.getElementById("imageDataBase64").value = "";
        document.getElementById("imageUploadStatus").innerText = "";
        document.getElementById("orderDate").valueAsDate = new Date();
        document.getElementById("formTitle").innerText = "📝 新增客戶訂單";
        document.getElementById("saveBtn").innerText = "儲存訂單至雲端";
        document.getElementById("cancelBtn").style.display = "none";
        document.getElementById("customFeederGroup").style.display = "none";
        updateStockSummary();
    };

    window.openModal = function(imgSrc) {
        document.getElementById("modalImg").src = imgSrc;
        document.getElementById("imageModal").style.display = "flex";
    };

    window.closeModal = function() {
        document.getElementById("imageModal").style.display = "none";
    };

    window.exportOrdersToExcel = function() {
        if (currentRenderedOrders.length === 0) {
            alert("目前沒有訂單可供匯出！");
            return;
        }

        const excelData = currentRenderedOrders.map(item => ({
            "下單日期": item.orderDate,
            "交期": item.dueDate,
            "客戶名稱": item.customerName,
            "布種": item.fabricType,
            "幅寬/碼重": item.widthWeight || "",
            "數量": item.quantity,
            "機台吋數": item.machineInch || "",
            "機台針數": item.machineGauge || "",
            "口數": item.feederCount || "",
            "紗種": item.yarnType,
            "紗比例": item.yarnRatio || "",
            "染整廠": item.dyeingFactory || "",
            "要染顏色": item.targetColor || "",
            "工繳": item.processingFee || ""
        }));

        const worksheet = XLSX.utils.json_to_sheet(excelData);
        const workbook = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(workbook, worksheet, "客戶訂單報表");

        const custLabel = document.getElementById("filterCustomer").value || "全部客戶";
        XLSX.writeFile(workbook, `德峰訂單報表_${custLabel}.xlsx`);
    };
</script>

</body>
</html>
