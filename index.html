<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>德峰訂單管理系統</title>
    <!-- 載入 SheetJS 以支援 Excel 匯出 -->
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <style>
        :root {
            --primary: #2563eb;
            --primary-light: #3b82f6;
            --primary-hover: #1d4ed8;
            --success: #10b981;
            --success-hover: #059669;
            --danger: #ef4444;
            --danger-hover: #dc2626;
            --excel: #16a34a;
            --excel-hover: #15803d;
            --bg: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #0f172a;
            --text-sub: #475569;
            --border: #cbd5e1;
        }

        * {
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }

        body {
            background-color: var(--bg);
            color: var(--text-main);
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        .header {
            background: linear-gradient(135deg, #1e293b, #334155);
            color: white;
            padding: 16px 32px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .header h1 {
            margin: 0;
            font-size: 1.5rem;
            font-weight: 700;
        }

        .status-badge {
            background-color: #d1fae5;
            color: #065f46;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
        }

        .btn-switch-system {
            background-color: rgba(255, 255, 255, 0.2);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.5);
            padding: 8px 16px;
            border-radius: 8px;
            font-size: 0.9rem;
            font-weight: 600;
            text-decoration: none;
            transition: all 0.2s ease;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .btn-switch-system:hover {
            background-color: white;
            color: #1e293b;
            box-shadow: 0 2px 8px rgba(0,0,0,0.15);
        }

        .main-container {
            padding: 20px 24px;
            display: grid;
            grid-template-columns: 420px minmax(0, 1fr);
            gap: 20px;
            align-items: start;
        }

        @media (max-width: 1100px) {
            .main-container {
                grid-template-columns: 1fr;
            }
        }

        .card {
            background: var(--card-bg);
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05);
            border: 1px solid rgba(226, 232, 240, 0.8);
            margin-bottom: 20px;
        }

        .card-title {
            margin-top: 0;
            margin-bottom: 16px;
            color: var(--primary);
            font-size: 1.15rem;
            font-weight: 700;
            padding-bottom: 8px;
            border-bottom: 2px solid #f1f5f9;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 12px;
            margin-bottom: 20px;
        }

        .full-width {
            grid-column: span 2;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        label {
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text-sub);
        }

        input, select, textarea {
            width: 100%;
            padding: 9px 11px;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 0.9rem;
            outline: none;
            background-color: #f8fafc;
            box-sizing: border-box;
        }

        input:focus, select:focus, textarea:focus {
            border-color: var(--primary-light);
            background-color: #fff;
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.15);
        }

        .yarn-stock-info {
            background-color: #eff6ff;
            border: 1px solid #bfdbfe;
            color: #1e40af;
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 0.85rem;
            font-weight: 600;
            margin-top: 2px;
            display: none;
        }

        .btn-group {
            display: flex;
            gap: 10px;
        }

        button {
            padding: 10px 18px;
            border: none;
            border-radius: 8px;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        .btn-primary { background-color: var(--primary-light); color: white; }
        .btn-primary:hover { background-color: var(--primary-hover); }

        .btn-success { background-color: var(--success); color: white; width: 100%; }
        .btn-success:hover { background-color: var(--success-hover); }

        .btn-excel { background-color: var(--excel); color: white; white-space: nowrap; }
        .btn-excel:hover { background-color: var(--excel-hover); }

        .btn-danger { background-color: var(--danger); color: white; padding: 4px 8px; font-size: 0.85rem; }
        .btn-danger:hover { background-color: var(--danger-hover); }

        .right-column {
            display: flex;
            flex-direction: column;
            gap: 20px;
            min-width: 0;
        }

        .filter-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 12px;
            align-items: end;
        }

        .action-btns {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            grid-column: span 2;
            margin-top: 8px;
        }

        .stats-bar {
            display: flex;
            gap: 16px;
            background: #f1f5f9;
            padding: 12px 16px;
            border-radius: 8px;
            margin-top: 12px;
            font-size: 0.9rem;
            font-weight: 600;
            color: var(--text-main);
            flex-wrap: wrap;
        }

        .stats-item span {
            color: var(--primary);
            font-size: 1.05rem;
        }

        .table-responsive {
            width: 100%;
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: separate;
            border-spacing: 0;
            text-align: left;
            font-size: 0.9rem;
        }

        th {
            background-color: #f8fafc;
            color: var(--text-sub);
            font-weight: 600;
            padding: 10px 12px;
            border-bottom: 2px solid var(--border);
            white-space: nowrap;
        }

        td {
            padding: 10px 12px;
            border-bottom: 1px solid var(--border);
            color: var(--text-main);
            vertical-align: middle;
            white-space: nowrap;
        }

        tbody tr:hover { background-color: #f8fafc; }

        .no-data { text-align: center; color: #94a3b8; padding: 32px; }
    </style>
</head>
<body>

<div class="header">
    <div class="header-left">
        <h1>📋 德峰訂單管理系統</h1>
        <span class="status-badge">🟢 雲端連線中</span>
    </div>
    <a href="yarn.html" class="btn-switch-system">🧶 切換至紗帳系統 ➔</a>
</div>

<div class="main-container">

    <!-- 左側表單 -->
    <div class="card">
        <h2 class="card-title" id="formTitle">📝 新增訂單</h2>
        <form id="orderForm">
            <input type="hidden" id="editKey" value="">

            <div class="form-grid">
                
                <div class="form-group full-width">
                    <label for="orderDate">下單日期</label>
                    <input type="date" id="orderDate" required>
                </div>

                <div class="form-group full-width">
                    <label for="customerName">客戶名稱</label>
                    <input type="text" id="customerName" list="customerDatalist" required placeholder="請選擇或輸入客戶名稱..." onchange="onCustomerChange()" oninput="onCustomerChange()">
                    <datalist id="customerDatalist"></datalist>
                </div>

                <!-- 紗種動態下拉選單 -->
                <div class="form-group full-width">
                    <label for="yarnType">紗種（自動抓取紗帳庫存）</label>
                    <input type="text" id="yarnType" list="yarnTypeDatalist" required placeholder="先輸入客戶以選擇紗種..." onchange="updateYarnStockTip()" oninput="updateYarnStockTip()">
                    <datalist id="yarnTypeDatalist"></datalist>
                    <div id="yarnStockTip" class="yarn-stock-info"></div>
                </div>

                <div class="form-group full-width">
                    <label for="fabricType">布種 / 規格</label>
                    <input type="text" id="fabricType" placeholder="例如：單面布、雙面PK">
                </div>

                <div class="form-group">
                    <label for="orderQuantity">訂購數量</label>
                    <input type="number" step="0.01" id="orderQuantity" required placeholder="例如：1000">
                </div>

                <div class="form-group">
                    <label for="unit">單位</label>
                    <select id="unit">
                        <option value="公斤">公斤 (kg)</option>
                        <option value="碼">碼 (yd)</option>
                        <option value="件">件</option>
                        <option value="條">條</option>
                    </select>
                </div>

                <div class="form-group full-width">
                    <label for="deliveryDate">預計交期</label>
                    <input type="date" id="deliveryDate">
                </div>

                <div class="form-group full-width">
                    <label for="status">訂單狀態</label>
                    <select id="status">
                        <option value="未完工">未完工</option>
                        <option value="已完工">已完工</option>
                        <option value="已交貨">已交貨</option>
                        <option value="已取消">已取消</option>
                    </select>
                </div>

                <div class="form-group full-width">
                    <label for="remark">備註說明</label>
                    <textarea id="remark" rows="2" placeholder="備註加工要求、色號等..."></textarea>
                </div>

            </div>

            <div class="btn-group">
                <button type="submit" class="btn-success" id="saveBtn">儲存訂單資料</button>
                <button type="button" class="btn-primary" id="cancelBtn" style="display:none; background-color: #64748b;" onclick="resetForm()">取消修改</button>
            </div>
        </form>
    </div>

    <!-- 右側列表與搜尋 -->
    <div class="right-column">
        
        <div class="card">
            <h2 class="card-title">🔍 訂單查詢與統計</h2>
            <div class="filter-grid">
                <div class="form-group">
                    <label for="filterCustomer">依客戶篩選</label>
                    <select id="filterCustomer" onchange="renderTable()">
                        <option value="">-- 全部客戶 --</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="filterStatus">依狀態篩選</label>
                    <select id="filterStatus" onchange="renderTable()">
                        <option value="">-- 全部狀態 --</option>
                        <option value="未完工">未完工</option>
                        <option value="已完工">已完工</option>
                        <option value="已交貨">已交貨</option>
                        <option value="已取消">已取消</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="filterKeyword">關鍵字搜尋</label>
                    <input type="text" id="filterKeyword" placeholder="搜尋紗種、布種、備註..." oninput="renderTable()">
                </div>
                
                <div class="action-btns">
                    <button class="btn-excel" onclick="exportOrdersToExcel()">📄 匯出 Excel 報表</button>
                </div>
            </div>

            <!-- 統計結果 -->
            <div class="stats-bar">
                <div class="stats-item">總筆數：<span id="statCount">0</span> 筆</div>
                <div class="stats-item">總數量：<span id="statTotalQty">0</span></div>
            </div>
        </div>

        <div class="card">
            <h2 class="card-title">📊 訂單明細列表</h2>
            <div class="table-responsive">
                <table>
                    <thead>
                        <tr>
                            <th>下單日期</th>
                            <th>客戶名稱</th>
                            <th>紗種</th>
                            <th>布種</th>
                            <th>訂購數量</th>
                            <th>單位</th>
                            <th>預計交期</th>
                            <th>狀態</th>
                            <th>備註</th>
                            <th>操作</th>
                        </tr>
                    </thead>
                    <tbody id="orderTableBody">
                        <tr><td colspan="10" class="no-data">載入訂單資料中...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>

    </div>

</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, push, set, remove, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const firebaseConfig = {
        apiKey: "AIzaSyAR1sHUr3Yx6z2-EdPxvnKk50X4XL0-wR4",
        authDomain: "defong-ab039.firebaseapp.com",
        databaseURL: "https://defong-ab039-default-rtdb.firebaseio.com",
        projectId: "defong-ab039",
        storageBucket: "defong-ab039.firebasestorage.app",
        messagingSenderId: "751338216702",
        appId: "1:751338216702:web:1892c102b6565c8543d9af",
        measurementId: "G-ZTV82ZDYSV"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    
    const orderRef = ref(db, 'orderRecords');
    // 對齊紗帳系統的節點路徑 'yarns'
    const yarnRef = ref(db, 'yarns');

    let orderDataMap = {};
    let yarnDataMap = {};
    let currentRenderedOrders = [];

    window.onload = function() {
        document.getElementById("orderDate").valueAsDate = new Date();
    };

    // 監聽訂單紀錄
    onValue(orderRef, (snapshot) => {
        orderDataMap = snapshot.val() || {};
        updateCustomerDropdowns();
        renderTable();
    });

    // 監聽紗帳紀錄（用於庫存與紗種連動）
    onValue(yarnRef, (snapshot) => {
        yarnDataMap = snapshot.val() || {};
        updateCustomerDropdowns();
        onCustomerChange(); // 重新整理動態紗種清單
    });

    // 更新客戶下拉提示（抓取訂單與紗帳系統中的客戶名稱，欄位：customer）
    function updateCustomerDropdowns() {
        const customers = new Set();
        Object.values(orderDataMap).forEach(i => i.customerName && customers.add(i.customerName.trim()));
        Object.values(yarnDataMap).forEach(i => i.customer && customers.add(i.customer.trim()));

        const sortedCustomers = Array.from(customers).sort();

        const datalist = document.getElementById("customerDatalist");
        datalist.innerHTML = "";
        sortedCustomers.forEach(c => {
            const opt = document.createElement("option");
            opt.value = c;
            datalist.appendChild(opt);
        });

        const filterSelect = document.getElementById("filterCustomer");
        const currentVal = filterSelect.value;
        filterSelect.innerHTML = '<option value="">-- 全部客戶 --</option>';
        sortedCustomers.forEach(c => {
            const opt = document.createElement("option");
            opt.value = c;
            opt.textContent = c;
            filterSelect.appendChild(opt);
        });
        filterSelect.value = currentVal;
    }

    // 當客戶改變時，自動擷取該客戶在「紗帳」中的紗種庫存（欄位：customer 與 type）
    window.onCustomerChange = function() {
        const custName = document.getElementById("customerName").value.trim();
        const yarnDatalist = document.getElementById("yarnTypeDatalist");
        yarnDatalist.innerHTML = "";

        if (!custName) {
            updateYarnStockTip();
            return;
        }

        // 搜尋此客戶在紗帳紀錄中的所有紗種
        const availableYarns = new Set();
        Object.values(yarnDataMap).forEach(item => {
            if (item.customer && item.customer.trim() === custName && item.type) {
                availableYarns.add(item.type.trim());
            }
        });

        // 填入紗種選項
        availableYarns.forEach(y => {
            const opt = document.createElement("option");
            opt.value = y;
            yarnDatalist.appendChild(opt);
        });

        updateYarnStockTip();
    };

    // 顯示選定客戶與紗種的總進紗量提示（欄位：customer, type, weight）
    window.updateYarnStockTip = function() {
        const custName = document.getElementById("customerName").value.trim();
        const yarnType = document.getElementById("yarnType").value.trim();
        const tipDiv = document.getElementById("yarnStockTip");

        if (!custName || !yarnType) {
            tipDiv.style.display = "none";
            return;
        }

        let totalWeight = 0;
        let recordCount = 0;

        Object.values(yarnDataMap).forEach(item => {
            if (item.customer && item.customer.trim() === custName &&
                item.type && item.type.trim() === yarnType) {
                totalWeight += parseFloat(item.weight) || 0;
                recordCount++;
            }
        });

        if (recordCount > 0) {
            tipDiv.style.display = "block";
            tipDiv.innerHTML = `💡 庫存資訊：${custName} 的 [${yarnType}] 累計進紗量為 <strong>${totalWeight.toFixed(2)} kg</strong> (${recordCount} 筆進紗紀錄)`;
        } else {
            tipDiv.style.display = "block";
            tipDiv.innerHTML = `⚠️ 提示：${custName} 目前在紗帳系統中尚未有 [${yarnType}] 的進紗紀錄`;
        }
    };

    window.renderTable = function() {
        const selectedCustomer = document.getElementById("filterCustomer").value;
        const selectedStatus = document.getElementById("filterStatus").value;
        const keyword = document.getElementById("filterKeyword").value.toLowerCase().trim();
        const tbody = document.getElementById("orderTableBody");
        tbody.innerHTML = "";

        currentRenderedOrders = [];

        Object.keys(orderDataMap).forEach(key => {
            const item = orderDataMap[key];
            const matchCustomer = !selectedCustomer || item.customerName === selectedCustomer;
            const matchStatus = !selectedStatus || item.status === selectedStatus;
            const matchKeyword = !keyword ||
                (item.customerName && item.customerName.toLowerCase().includes(keyword)) ||
                (item.yarnType && item.yarnType.toLowerCase().includes(keyword)) ||
                (item.fabricType && item.fabricType.toLowerCase().includes(keyword)) ||
                (item.remark && item.remark.toLowerCase().includes(keyword));

            if (matchCustomer && matchStatus && matchKeyword) {
                currentRenderedOrders.push({ key, ...item });
            }
        });

        currentRenderedOrders.sort((a,b) => new Date(b.orderDate) - new Date(a.orderDate));

        let totalQty = 0;
        currentRenderedOrders.forEach(item => {
            totalQty += parseFloat(item.orderQuantity) || 0;
        });

        document.getElementById("statCount").innerText = currentRenderedOrders.length;
        document.getElementById("statTotalQty").innerText = totalQty.toFixed(2);

        if (currentRenderedOrders.length === 0) {
            tbody.innerHTML = '<tr><td colspan="10" class="no-data">目前無符合條件的訂單資料</td></tr>';
            return;
        }

        currentRenderedOrders.forEach(item => {
            let statusStyle = "";
            if (item.status === "已完工") statusStyle = "color:#10b981; font-weight:bold;";
            else if (item.status === "已交貨") statusStyle = "color:#2563eb; font-weight:bold;";
            else if (item.status === "已取消") statusStyle = "color:#94a3b8; text-decoration:line-through;";
            else statusStyle = "color:#f59e0b; font-weight:bold;";

            const row = document.createElement("tr");
            row.innerHTML = `
                <td><strong>${item.orderDate || "-"}</strong></td>
                <td><strong>${item.customerName || "-"}</strong></td>
                <td>${item.yarnType || "-"}</td>
                <td>${item.fabricType || "-"}</td>
                <td><strong>${item.orderQuantity || 0}</strong></td>
                <td>${item.unit || "公斤"}</td>
                <td>${item.deliveryDate || "-"}</td>
                <td><span style="${statusStyle}">${item.status || "未完工"}</span></td>
                <td>${item.remark || "-"}</td>
                <td>
                    <button class="btn-primary" style="padding: 4px 8px; font-size: 0.85rem;" onclick="editOrder('${item.key}')">編輯</button>
                    <button class="btn-danger" onclick="deleteOrder('${item.key}')">刪除</button>
                </td>
            `;
            tbody.appendChild(row);
        });
    };

    document.getElementById("orderForm").addEventListener("submit", function(e) {
        e.preventDefault();

        const editKey = document.getElementById("editKey").value;

        const orderData = {
            orderDate: document.getElementById("orderDate").value,
            customerName: document.getElementById("customerName").value.trim(),
            yarnType: document.getElementById("yarnType").value.trim(),
            fabricType: document.getElementById("fabricType").value.trim(),
            orderQuantity: parseFloat(document.getElementById("orderQuantity").value) || 0,
            unit: document.getElementById("unit").value,
            deliveryDate: document.getElementById("deliveryDate").value,
            status: document.getElementById("status").value,
            remark: document.getElementById("remark").value.trim()
        };

        if (!editKey) {
            push(orderRef, orderData);
        } else {
            set(ref(db, `orderRecords/${editKey}`), orderData);
        }

        resetForm();
    });

    window.editOrder = function(key) {
        const item = orderDataMap[key];
        document.getElementById("editKey").value = key;
        document.getElementById("orderDate").value = item.orderDate || "";
        document.getElementById("customerName").value = item.customerName || "";
        document.getElementById("yarnType").value = item.yarnType || "";
        document.getElementById("fabricType").value = item.fabricType || "";
        document.getElementById("orderQuantity").value = item.orderQuantity || "";
        document.getElementById("unit").value = item.unit || "公斤";
        document.getElementById("deliveryDate").value = item.deliveryDate || "";
        document.getElementById("status").value = item.status || "未完工";
        document.getElementById("remark").value = item.remark || "";

        document.getElementById("formTitle").innerText = "✏️ 編輯訂單";
        document.getElementById("saveBtn").innerText = "更新訂單資料";
        document.getElementById("cancelBtn").style.display = "inline-flex";

        onCustomerChange();
        window.scrollTo({ top: 0, behavior: 'smooth' });
    };

    window.deleteOrder = function(key) {
        const item = orderDataMap[key];
        const label = item ? `${item.customerName} - ${item.yarnType}` : "這筆";
        if (confirm(`確定要刪除「${label}」的訂單嗎？`)) {
            remove(ref(db, `orderRecords/${key}`));
        }
    };

    window.resetForm = function() {
        document.getElementById("orderForm").reset();
        document.getElementById("editKey").value = "";
        document.getElementById("orderDate").valueAsDate = new Date();
        document.getElementById("formTitle").innerText = "📝 新增訂單";
        document.getElementById("saveBtn").innerText = "儲存訂單資料";
        document.getElementById("cancelBtn").style.display = "none";
        document.getElementById("yarnStockTip").style.display = "none";
    };

    window.exportOrdersToExcel = function() {
        if (currentRenderedOrders.length === 0) {
            alert("目前沒有訂單紀錄可供匯出！");
            return;
        }

        const excelData = currentRenderedOrders.map(item => ({
            "下單日期": item.orderDate,
            "客戶名稱": item.customerName,
            "紗種": item.yarnType,
            "布種/規格": item.fabricType || "",
            "訂購數量": item.orderQuantity,
            "單位": item.unit || "公斤",
            "預計交期": item.deliveryDate || "",
            "狀態": item.status || "未完工",
            "備註": item.remark || ""
        }));

        const worksheet = XLSX.utils.json_to_sheet(excelData);
        const workbook = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(workbook, worksheet, "訂單明細");

        const custLabel = document.getElementById("filterCustomer").value || "全部客戶";
        XLSX.writeFile(workbook, `德峰訂單報表_${custLabel}.xlsx`);
    };
</script>

</body>
</html>
