<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>德峰訂單管理系統</title>
    <!-- 載入 SheetJS 以支援 Excel 匯出 -->
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <style>
        :root {
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --bg: #f8fafc;
            --card-bg: #ffffff;
            --success: #10b981;
            --success-hover: #059669;
            --danger: #ef4444;
            --danger-hover: #dc2626;
            --excel: #16a34a;
            --excel-hover: #15803d;
            --text-main: #0f172a;
            --text-sub: #475569;
            --border: #cbd5e1;
        }

        * {
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }

        body {
            background-color: var(--bg);
            color: var(--text-main);
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        .header {
            background: linear-gradient(135deg, var(--primary), #3b82f6);
            color: white;
            padding: 16px 32px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .header h1 {
            margin: 0;
            font-size: 1.5rem;
            color: white;
            font-weight: 700;
        }

        .status-badge {
            background-color: #d1fae5;
            color: #065f46;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
        }

        .btn-switch-system {
            background-color: rgba(255, 255, 255, 0.2);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.5);
            padding: 8px 16px;
            border-radius: 8px;
            font-size: 0.9rem;
            font-weight: 600;
            text-decoration: none;
            transition: all 0.2s ease;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .btn-switch-system:hover {
            background-color: white;
            color: var(--primary);
            box-shadow: 0 2px 8px rgba(0,0,0,0.15);
        }

        .main-container {
            padding: 20px 24px;
            display: grid;
            grid-template-columns: 460px minmax(0, 1fr);
            gap: 20px;
            align-items: start;
        }

        @media (max-width: 1100px) {
            .main-container {
                grid-template-columns: 1fr;
            }
        }

        .card {
            background: var(--card-bg);
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05);
            border: 1px solid rgba(226, 232, 240, 0.8);
            margin-bottom: 20px;
        }

        .card-title {
            margin-top: 0;
            margin-bottom: 16px;
            color: var(--primary);
            font-size: 1.15rem;
            font-weight: 700;
            padding-bottom: 8px;
            border-bottom: 2px solid #f1f5f9;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 12px;
            margin-bottom: 20px;
        }

        .full-width {
            grid-column: span 2;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        label {
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text-sub);
        }

        input, select, textarea {
            width: 100%;
            padding: 9px 11px;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 0.9rem;
            outline: none;
            background-color: #f8fafc;
        }

        input:focus, select:focus, textarea:focus {
            border-color: var(--primary);
            background-color: #fff;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
        }

        .yarn-selection-box {
            background: #f1f5f9;
            border: 1px dashed var(--border);
            border-radius: 8px;
            padding: 10px;
            max-height: 140px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .yarn-item {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.85rem;
            cursor: pointer;
        }

        .yarn-item input[type="checkbox"] {
            width: auto;
            margin: 0;
            cursor: pointer;
        }

        /* 相片預覽區樣式 */
        .photo-preview-container {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-top: 6px;
        }

        .img-preview {
            width: 70px;
            height: 70px;
            object-fit: cover;
            border-radius: 8px;
            border: 1px solid var(--border);
            cursor: pointer;
            transition: transform 0.2s;
        }

        .img-preview:hover {
            transform: scale(1.05);
        }

        .btn-remove-photo {
            background-color: var(--danger);
            color: white;
            border: none;
            border-radius: 6px;
            padding: 4px 8px;
            font-size: 0.75rem;
            cursor: pointer;
        }

        .btn-group {
            display: flex;
            gap: 10px;
        }

        button {
            padding: 10px 18px;
            border: none;
            border-radius: 8px;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        .btn-primary { background-color: var(--primary); color: white; }
        .btn-primary:hover { background-color: var(--primary-hover); }

        .btn-success { background-color: var(--success); color: white; width: 100%; }
        .btn-success:hover { background-color: var(--success-hover); }

        .btn-excel { background-color: var(--excel); color: white; white-space: nowrap; }
        .btn-excel:hover { background-color: var(--excel-hover); }

        .btn-danger { background-color: var(--danger); color: white; padding: 4px 8px; font-size: 0.85rem; }
        .btn-danger:hover { background-color: var(--danger-hover); }

        .right-column {
            display: flex;
            flex-direction: column;
            gap: 20px;
            min-width: 0;
        }

        .filter-grid {
            display: grid;
            grid-template-columns: 1fr 1fr auto;
            gap: 12px;
            align-items: end;
        }

        @media (max-width: 768px) {
            .filter-grid { grid-template-columns: 1fr; }
        }

        .table-responsive {
            width: 100%;
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: separate;
            border-spacing: 0;
            text-align: left;
            font-size: 0.85rem;
        }

        th {
            background-color: #f8fafc;
            color: var(--text-sub);
            font-weight: 600;
            padding: 10px 10px;
            border-bottom: 2px solid var(--border);
            white-space: nowrap;
        }

        td {
            padding: 10px 10px;
            border-bottom: 1px solid var(--border);
            color: var(--text-main);
            vertical-align: middle;
        }

        tbody tr:hover { background-color: #f8fafc; }

        .table-img {
            width: 48px;
            height: 48px;
            object-fit: cover;
            border-radius: 6px;
            border: 1px solid var(--border);
            cursor: pointer;
        }

        .no-data { text-align: center; color: #94a3b8; padding: 32px; }
    </style>
</head>
<body>

    <!-- 頂部導覽列 -->
    <div class="header">
        <div class="header-left">
            <h1>📋 德峰訂單管理系統</h1>
            <span class="status-badge">🟢 雲端連線中</span>
        </div>
        <a href="yarn_system.html" class="btn-switch-system">📦 切換至紗帳系統 ➔</a>
    </div>

    <!-- 主要內容區塊 -->
    <div class="main-container">

        <!-- 左側：輸入表單 -->
        <div class="card">
            <h2 class="card-title" id="formTitle">📝 新增訂單資料</h2>
            <form id="orderForm">
                <input type="hidden" id="editKey" value="">

                <div class="form-grid">
                    <div class="form-group full-width">
                        <label for="customerName">客戶名稱</label>
                        <input type="text" id="customerName" list="customerDatalist" required placeholder="點選選單或輸入名稱..." onchange="onCustomerChange()" oninput="onCustomerChange()" onfocus="this.select()">
                        <datalist id="customerDatalist"></datalist>
                    </div>

                    <div class="form-group">
                        <label for="orderDate">訂單日期</label>
                        <input type="date" id="orderDate" required>
                    </div>

                    <div class="form-group">
                        <label for="deliveryDate">預計交期</label>
                        <input type="date" id="deliveryDate">
                    </div>

                    <div class="form-group">
                        <label for="fabricType">布種 / 規格</label>
                        <input type="text" id="fabricType" required placeholder="例如：雙面單面布">
                    </div>

                    <div class="form-group">
                        <label for="widthWeight">幅寬 / 碼重</label>
                        <input type="text" id="widthWeight" placeholder="例如：60&quot; / 220g">
                    </div>

                    <div class="form-group">
                        <label for="machineInch">機台吋數</label>
                        <input type="text" id="machineInch" placeholder="例如：30&quot;">
                    </div>

                    <div class="form-group">
                        <label for="machineNeedle">機台針數</label>
                        <input type="text" id="machineNeedle" placeholder="例如：24G">
                    </div>

                    <div class="form-group">
                        <label for="feederCount">口數</label>
                        <input type="text" id="feederCount" list="feederOptions" placeholder="選擇或自行輸入">
                        <datalist id="feederOptions">
                            <option value="60"></option>
                            <option value="88"></option>
                            <option value="90"></option>
                            <option value="96"></option>
                            <option value="108"></option>
                            <option value="120"></option>
                        </datalist>
                    </div>

                    <div class="form-group">
                        <label for="quantity">數量 (kg)</label>
                        <input type="number" step="0.1" id="quantity" required placeholder="例如：100">
                    </div>

                    <!-- 紗種區塊 (連動紗帳系統) -->
                    <div class="form-group full-width">
                        <label>紗種 (勾選該客戶庫存紗種)</label>
                        <div id="yarnCheckboxGroup" class="yarn-selection-box">
                            <span style="color: #94a3b8; font-size: 0.85rem;">請先輸入或選擇「客戶名稱」以載入可用紗種...</span>
                        </div>
                        <input type="text" id="yarnTypeCustom" placeholder="或手動輸入紗種補充..." style="margin-top: 4px;">
                    </div>

                    <div class="form-group">
                        <label for="color">顏色</label>
                        <input type="text" id="color" placeholder="例如：黑色、藏青">
                    </div>

                    <div class="form-group">
                        <label for="dyeingFactory">染整廠</label>
                        <input type="text" id="dyeingFactory" placeholder="例如：德峰染廠">
                    </div>

                    <!-- 新增：訂單照片上傳 -->
                    <div class="form-group full-width">
                        <label for="orderPhoto">📷 上傳訂單照片 / 布樣圖</label>
                        <input type="file" id="orderPhoto" accept="image/*" onchange="handlePhotoUpload(event)">
                        <div id="photoPreviewArea" class="photo-preview-container" style="display: none;">
                            <img id="photoPreviewImg" src="" class="img-preview" alt="照片預覽" onclick="viewImage(this.src)">
                            <button type="button" class="btn-remove-photo" onclick="clearPhoto()">移除照片</button>
                        </div>
                    </div>

                    <div class="form-group full-width">
                        <label for="remark">備註說明</label>
                        <textarea id="remark" rows="3" placeholder="加工要求、其他細節等..."></textarea>
                    </div>
                </div>

                <div class="btn-group">
                    <button type="submit" class="btn-success" id="saveBtn">儲存訂單資料</button>
                    <button type="button" class="btn-primary" id="cancelBtn" style="display:none; background-color: #64748b;" onclick="resetForm()">取消修改</button>
                </div>
            </form>
        </div>

        <!-- 右側：篩選與列表 -->
        <div class="right-column">
            <div class="card">
                <h2 class="card-title">🔍 訂單資料查詢與篩選</h2>
                <div class="filter-grid">
                    <div class="form-group">
                        <label for="filterCustomer">依客戶篩選</label>
                        <select id="filterCustomer" onchange="renderTable()">
                            <option value="">-- 全部客戶 --</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="filterKeyword">關鍵字搜尋</label>
                        <input type="text" id="filterKeyword" placeholder="搜尋布種、紗種、顏色、備註..." oninput="renderTable()">
                    </div>
                    <div>
                        <button class="btn-excel" onclick="exportOrdersToExcel()">📄 匯出 Excel 訂單報表</button>
                    </div>
                </div>
            </div>

            <div class="card">
                <h2 class="card-title">📊 訂單歷史明細清單</h2>
                <div class="table-responsive">
                    <table>
                        <thead>
                            <tr>
                                <th>照片</th>
                                <th>訂單日期</th>
                                <th>客戶名稱</th>
                                <th>布種 / 幅寬碼重</th>
                                <th>機台規格</th>
                                <th>紗種</th>
                                <th>數量(kg)</th>
                                <th>顏色/染廠</th>
                                <th>備註</th>
                                <th>操作</th>
                            </tr>
                        </thead>
                        <tbody id="orderTableBody">
                            <tr><td colspan="10" class="no-data">載入訂單資料中...</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

    </div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, push, set, remove, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const firebaseConfig = {
        apiKey: "AIzaSyAR1sHUr3Yx6z2-EdPxvnKk50X4XL0-wR4",
        authDomain: "defong-ab039.firebaseapp.com",
        databaseURL: "https://defong-ab039-default-rtdb.firebaseio.com",
        projectId: "defong-ab039",
        storageBucket: "defong-ab039.firebasestorage.app",
        messagingSenderId: "751338216702",
        appId: "1:751338216702:web:1892c102b6565c8543d9af",
        measurementId: "G-ZTV82ZDYSV"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    
    const orderRef = ref(db, 'orderRecords');
    const yarnRef = ref(db, 'yarnRecords');

    let orderDataMap = {};
    let yarnDataMap = {};
    let currentRenderedOrders = [];
    let currentBase64Photo = ""; // 暫存目前上傳照片 Base64 數據

    window.onload = function() {
        document.getElementById("orderDate").valueAsDate = new Date();
    };

    // 格式化單位輔助函式
    function formatInch(val) {
        if (!val) return '';
        const clean = val.toString().replace(/["吋]/g, '').trim();
        return clean ? `${clean}"` : '';
    }

    function formatNeedle(val) {
        if (!val) return '';
        const clean = val.toString().replace(/[Gg針]/g, '').trim();
        return clean ? `${clean}G` : '';
    }

    // 監聽訂單資料
    onValue(orderRef, (snapshot) => {
        orderDataMap = snapshot.val() || {};
        updateCustomerDropdowns();
        window.renderTable();
    });

    // 監聽紗帳進出資料
    onValue(yarnRef, (snapshot) => {
        yarnDataMap = snapshot.val() || {};
        updateCustomerDropdowns();
        window.onCustomerChange();
    });

    function updateCustomerDropdowns() {
        const customers = new Set();
        Object.values(orderDataMap).forEach(i => i.customerName && customers.add(i.customerName.trim()));
        Object.values(yarnDataMap).forEach(i => i.customerName && customers.add(i.customerName.trim()));

        const sortedCustomers = Array.from(customers).sort();

        const datalist = document.getElementById("customerDatalist");
        datalist.innerHTML = "";
        sortedCustomers.forEach(c => {
            const opt = document.createElement("option");
            opt.value = c;
            datalist.appendChild(opt);
        });

        const filterSelect = document.getElementById("filterCustomer");
        const currentVal = filterSelect.value;
        filterSelect.innerHTML = '<option value="">-- 全部客戶 --</option>';
        sortedCustomers.forEach(c => {
            const opt = document.createElement("option");
            opt.value = c;
            opt.textContent = c;
            filterSelect.appendChild(opt);
        });
        filterSelect.value = currentVal;
    }

    // 依客戶連動紗帳庫存
    window.onCustomerChange = function() {
        const custName = document.getElementById("customerName").value.trim();
        const container = document.getElementById("yarnCheckboxGroup");

        if (!custName) {
            container.innerHTML = '<span style="color: #94a3b8; font-size: 0.85rem;">請先輸入或選擇「客戶名稱」以載入可用紗種...</span>';
            return;
        }

        const yarnStockMap = {};
        Object.values(yarnDataMap).forEach(item => {
            if (item.customerName && item.customerName.trim() === custName && item.yarnType) {
                const type = item.yarnType.trim();
                const weight = parseFloat(item.weight) || 0;
                const isOut = item.type === '出紗' || item.type === 'OUT' || item.type === '出庫';
                const sign = isOut ? -1 : 1;
                yarnStockMap[type] = (yarnStockMap[type] || 0) + (weight * sign);
            }
        });

        const availableYarns = Object.keys(yarnStockMap).filter(type => yarnStockMap[type] > 0);

        if (availableYarns.length === 0) {
            container.innerHTML = `<span style="color: #94a3b8; font-size: 0.85rem;">該客戶目前無紗庫存紀錄</span>`;
            return;
        }

        const selectedValues = Array.from(container.querySelectorAll('input[type="checkbox"]:checked')).map(cb => cb.value);

        container.innerHTML = "";
        availableYarns.forEach(y => {
            const label = document.createElement("label");
            label.className = "yarn-item";
            const checked = selectedValues.includes(y) ? "checked" : "";
            const stockQty = Math.round(yarnStockMap[y] * 100) / 100;
            label.innerHTML = `<input type="checkbox" value="${y}" ${checked}> ${y} <span style="color:#64748b; font-size:0.75rem;">(庫存: ${stockQty}kg)</span>`;
            container.appendChild(label);
        });
    };

    // 圖片壓縮並轉為 Base64 處理
    window.handlePhotoUpload = function(event) {
        const file = event.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = function(e) {
            const img = new Image();
            img.onload = function() {
                const maxWidth = 800;
                const maxHeight = 800;
                let width = img.width;
                let height = img.height;

                if (width > height) {
                    if (width > maxWidth) {
                        height *= maxWidth / width;
                        width = maxWidth;
                    }
                } else {
                    if (height > maxHeight) {
                        width *= maxHeight / height;
                        height = maxHeight;
                    }
                }

                const canvas = document.createElement("canvas");
                canvas.width = width;
                canvas.height = height;
                const ctx = canvas.getContext("2d");
                ctx.drawImage(img, 0, 0, width, height);

                currentBase64Photo = canvas.toDataURL("image/jpeg", 0.7);
                document.getElementById("photoPreviewImg").src = currentBase64Photo;
                document.getElementById("photoPreviewArea").style.display = "flex";
            };
            img.src = e.target.result;
        };
        reader.readAsDataURL(file);
    };

    // 清除上傳照片
    window.clearPhoto = function() {
        currentBase64Photo = "";
        document.getElementById("orderPhoto").value = "";
        document.getElementById("photoPreviewImg").src = "";
        document.getElementById("photoPreviewArea").style.display = "none";
    };

    // 點擊放大查看圖片
    window.viewImage = function(src) {
        if (!src) return;
        const w = window.open("");
        w.document.write(`<img src="${src}" style="max-width:100%; height:auto; display:block; margin:auto;">`);
    };

    window.renderTable = function() {
        const selectedCustomer = document.getElementById("filterCustomer").value;
        const keyword = document.getElementById("filterKeyword").value.toLowerCase().trim();
        const tbody = document.getElementById("orderTableBody");
        tbody.innerHTML = "";

        currentRenderedOrders = [];

        Object.keys(orderDataMap).forEach(key => {
            const item = orderDataMap[key];
            const matchCustomer = !selectedCustomer || item.customerName === selectedCustomer;
            const matchKeyword = !keyword ||
                (item.customerName && item.customerName.toLowerCase().includes(keyword)) ||
                (item.fabricType && item.fabricType.toLowerCase().includes(keyword)) ||
                (item.yarnType && item.yarnType.toLowerCase().includes(keyword)) ||
                (item.color && item.color.toLowerCase().includes(keyword)) ||
                (item.dyeingFactory && item.dyeingFactory.toLowerCase().includes(keyword)) ||
                (item.remark && item.remark.toLowerCase().includes(keyword));

            if (matchCustomer && matchKeyword) {
                currentRenderedOrders.push({ key, ...item });
            }
        });

        currentRenderedOrders.sort((a,b) => new Date(b.orderDate) - new Date(a.orderDate));

        if (currentRenderedOrders.length === 0) {
            tbody.innerHTML = '<tr><td colspan="10" class="no-data">目前無符合條件的訂單資料</td></tr>';
            return;
        }

        currentRenderedOrders.forEach(item => {
            const row = document.createElement("tr");

            const formattedInch = formatInch(item.machineInch);
            const formattedNeedle = formatNeedle(item.machineNeedle);

            const specs = [
                formattedInch,
                formattedNeedle,
                item.feederCount ? `${item.feederCount}口` : ''
            ].filter(Boolean).join(' / ') || '-';

            const colorDye = [
                item.color || '',
                item.dyeingFactory ? `(${item.dyeingFactory})` : ''
            ].filter(Boolean).join(' ') || '-';

            const photoHtml = item.photoBase64 
                ? `<img src="${item.photoBase64}" class="table-img" onclick="viewImage('${item.photoBase64}')" title="點擊放大查看">` 
                : `<span style="color:#cbd5e1;">無照片</span>`;

            row.innerHTML = `
                <td>${photoHtml}</td>
                <td><strong>${item.orderDate || "-"}</strong></td>
                <td><strong>${item.customerName}</strong></td>
                <td>${item.fabricType || "-"}<br><small style="color:#64748b">${item.widthWeight || ""}</small></td>
                <td>${specs}</td>
                <td>${item.yarnType || "-"}</td>
                <td><strong>${item.quantity} kg</strong></td>
                <td>${colorDye}</td>
                <td>${item.remark || "-"}</td>
                <td>
                    <button class="btn-primary" style="padding: 4px 8px; font-size: 0.85rem;" onclick="editOrder('${item.key}')">編輯</button>
                    <button class="btn-danger" onclick="deleteOrder('${item.key}')">刪除</button>
                </td>
            `;
            tbody.appendChild(row);
        });
    };

    document.getElementById("orderForm").addEventListener("submit", function(e) {
        e.preventDefault();

        const editKey = document.getElementById("editKey").value;

        const checkedYarns = Array.from(document.querySelectorAll('#yarnCheckboxGroup input[type="checkbox"]:checked'))
                                  .map(cb => cb.value);
        const customYarn = document.getElementById("yarnTypeCustom").value.trim();
        if (customYarn) checkedYarns.push(customYarn);
        const finalYarnType = checkedYarns.join('、');

        const rawInch = document.getElementById("machineInch").value.trim();
        const rawNeedle = document.getElementById("machineNeedle").value.trim();

        const orderData = {
            customerName: document.getElementById("customerName").value.trim(),
            orderDate: document.getElementById("orderDate").value,
            deliveryDate: document.getElementById("deliveryDate").value,
            fabricType: document.getElementById("fabricType").value.trim(),
            widthWeight: document.getElementById("widthWeight").value.trim(),
            machineInch: formatInch(rawInch),
            machineNeedle: formatNeedle(rawNeedle),
            feederCount: document.getElementById("feederCount").value.trim(),
            quantity: parseFloat(document.getElementById("quantity").value) || 0,
            yarnType: finalYarnType,
            color: document.getElementById("color").value.trim(),
            dyeingFactory: document.getElementById("dyeingFactory").value.trim(),
            photoBase64: currentBase64Photo,
            remark: document.getElementById("remark").value.trim()
        };

        if (!editKey) {
            push(orderRef, orderData);
        } else {
            set(ref(db, `orderRecords/${editKey}`), orderData);
        }

        window.resetForm();
    });

    window.editOrder = function(key) {
        const item = orderDataMap[key];
        document.getElementById("editKey").value = key;
        document.getElementById("customerName").value = item.customerName;
        window.onCustomerChange();

        document.getElementById("orderDate").value = item.orderDate;
        document.getElementById("deliveryDate").value = item.deliveryDate || "";
        document.getElementById("fabricType").value = item.fabricType || "";
        document.getElementById("widthWeight").value = item.widthWeight || "";
        document.getElementById("machineInch").value = formatInch(item.machineInch || "");
        document.getElementById("machineNeedle").value = formatNeedle(item.machineNeedle || "");
        document.getElementById("feederCount").value = item.feederCount || "";
        document.getElementById("quantity").value = item.quantity;
        document.getElementById("color").value = item.color || "";
        document.getElementById("dyeingFactory").value = item.dyeingFactory || "";
        document.getElementById("remark").value = item.remark || "";

        // 回顯照片
        if (item.photoBase64) {
            currentBase64Photo = item.photoBase64;
            document.getElementById("photoPreviewImg").src = item.photoBase64;
            document.getElementById("photoPreviewArea").style.display = "flex";
        } else {
            window.clearPhoto();
        }

        const selectedYarns = (item.yarnType || "").split('、');
        const checkboxes = document.querySelectorAll('#yarnCheckboxGroup input[type="checkbox"]');
        let remainingYarns = [...selectedYarns];

        checkboxes.forEach(cb => {
            if (selectedYarns.includes(cb.value)) {
                cb.checked = true;
                remainingYarns = remainingYarns.filter(y => y !== cb.value);
            }
        });
        document.getElementById("yarnTypeCustom").value = remainingYarns.join('、');

        document.getElementById("formTitle").innerText = "✏️ 編輯訂單資料";
        document.getElementById("saveBtn").innerText = "更新訂單資料";
        document.getElementById("cancelBtn").style.display = "inline-flex";

        window.scrollTo({ top: 0, behavior: 'smooth' });
    };

    window.deleteOrder = function(key) {
        if (confirm("確定要刪除這筆訂單資料嗎？")) {
            remove(ref(db, `orderRecords/${key}`));
        }
    };

    window.resetForm = function() {
        document.getElementById("orderForm").reset();
        document.getElementById("editKey").value = "";
        document.getElementById("orderDate").valueAsDate = new Date();
        document.getElementById("formTitle").innerText = "📝 新增訂單資料";
        document.getElementById("saveBtn").innerText = "儲存訂單資料";
        document.getElementById("cancelBtn").style.display = "none";
        window.clearPhoto();
        window.onCustomerChange();
    };

    window.exportOrdersToExcel = function() {
        if (currentRenderedOrders.length === 0) {
            alert("目前沒有訂單紀錄可供匯出！");
            return;
        }

        const excelData = currentRenderedOrders.map(item => ({
            "訂單日期": item.orderDate,
            "預計交期": item.deliveryDate || "",
            "客戶名稱": item.customerName,
            "布種/規格": item.fabricType,
            "幅寬/碼重": item.widthWeight || "",
            "機台吋數": formatInch(item.machineInch || ""),
            "機台針數": formatNeedle(item.machineNeedle || ""),
            "口數": item.feederCount || "",
            "數量(kg)": item.quantity,
            "紗種": item.yarnType || "",
            "顏色": item.color || "",
            "染整廠": item.dyeingFactory || "",
            "是否有照片": item.photoBase64 ? "有照片" : "無",
            "備註": item.remark || ""
        }));

        const worksheet = XLSX.utils.json_to_sheet(excelData);
        const workbook = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(workbook, worksheet, "訂單報表");

        const custLabel = document.getElementById("filterCustomer").value || "全部客戶";
        XLSX.writeFile(workbook, `德峰訂單報表_${custLabel}.xlsx`);
    };
</script>

</body>
</html>
