<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, push, set, remove, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const firebaseConfig = {
        apiKey: "AIzaSyAR1sHUr3Yx6z2-EdPxvnKk50X4XL0-wR4",
        authDomain: "defong-ab039.firebaseapp.com",
        databaseURL: "https://defong-ab039-default-rtdb.firebaseio.com",
        projectId: "defong-ab039",
        storageBucket: "defong-ab039.firebasestorage.app",
        messagingSenderId: "751338216702",
        appId: "1:751338216702:web:1892c102b6565c8543d9af",
        measurementId: "G-ZTV82ZDYSV"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    
    const orderRef = ref(db, 'orderRecords');
    const yarnRef = ref(db, 'yarnRecords');

    let orderDataMap = {};
    let yarnDataMap = {};
    let currentRenderedOrders = [];

    window.addEventListener("DOMContentLoaded", () => {
        const dateInput = document.getElementById("orderDate");
        if (dateInput) dateInput.valueAsDate = new Date();

        // 綁定客戶輸入框的事件 (安全穩定監聽)
        const custInput = document.getElementById("customerName");
        if (custInput) {
            custInput.addEventListener("input", onCustomerChange);
            custInput.addEventListener("change", onCustomerChange);
            // 點擊輸入框時自動全選，方便快速切換客戶且不破壞選單
            custInput.addEventListener("focus", function() {
                this.select();
            });
        }

        // 綁定按鈕與篩選元件
        const filterCust = document.getElementById("filterCustomer");
        if (filterCust) filterCust.addEventListener("change", renderTable);

        const filterKey = document.getElementById("filterKeyword");
        if (filterKey) filterKey.addEventListener("input", renderTable);

        const exportBtn = document.getElementById("exportBtn");
        if (exportBtn) exportBtn.addEventListener("click", exportOrdersToExcel);

        const cancelBtn = document.getElementById("cancelBtn");
        if (cancelBtn) cancelBtn.addEventListener("click", resetForm);

        const orderForm = document.getElementById("orderForm");
        if (orderForm) {
            orderForm.addEventListener("submit", handleFormSubmit);
        }
    });

    // 監聽訂單資料
    onValue(orderRef, (snapshot) => {
        orderDataMap = snapshot.val() || {};
        updateCustomerDropdowns();
        renderTable();
    });

    // 監聽紗帳進出資料
    onValue(yarnRef, (snapshot) => {
        yarnDataMap = snapshot.val() || {};
        updateCustomerDropdowns();
        onCustomerChange();
    });

    // 更新所有客戶選單 (合併訂單與紗帳的客戶)
    function updateCustomerDropdowns() {
        const customers = new Set();
        
        // 收集訂單客戶 (欄位: customerName)
        Object.values(orderDataMap).forEach(i => {
            if (i && i.customerName) customers.add(String(i.customerName).trim());
        });
        
        // 收集紗帳客戶 (對應紗帳系統欄位: customer)
        Object.values(yarnDataMap).forEach(i => {
            if (!i) return;
            const cName = i.customer || i.customerName;
            if (cName) customers.add(String(cName).trim());
        });

        const sortedCustomers = Array.from(customers).filter(Boolean).sort();

        // 更新 datalist 選單
        const datalist = document.getElementById("customerDatalist");
        if (datalist) {
            datalist.innerHTML = "";
            sortedCustomers.forEach(c => {
                const opt = document.createElement("option");
                opt.value = c;
                datalist.appendChild(opt);
            });
        }

        // 更新表格上方篩選客戶選單
        const filterSelect = document.getElementById("filterCustomer");
        if (filterSelect) {
            const currentVal = filterSelect.value;
            filterSelect.innerHTML = '<option value="">-- 全部客戶 --</option>';
            sortedCustomers.forEach(c => {
                const opt = document.createElement("option");
                opt.value = c;
                opt.textContent = c;
                filterSelect.appendChild(opt);
            });
            filterSelect.value = currentVal;
        }
    }

    // 當客戶名稱變動時，連動帶出該客戶在紗帳系統中的紗種
    function onCustomerChange() {
        const custInput = document.getElementById("customerName");
        const custName = custInput ? custInput.value.trim().toLowerCase() : "";
        const container = document.getElementById("yarnCheckboxGroup");

        if (!container) return;

        if (!custName) {
            container.innerHTML = '<span style="color: #94a3b8; font-size: 0.85rem;">請先輸入或選擇「客戶名稱」以載入可用紗種...</span>';
            return;
        }

        // 統計該客戶在紗帳系統中的紗種與數量
        const yarnStockMap = {};

        Object.values(yarnDataMap).forEach(item => {
            if (!item) return;

            // 抓取紗帳系統的客戶欄位 (i.customer)
            const itemCustomer = String(item.customer || item.customerName || '').trim().toLowerCase();
            // 抓取紗帳系統的紗種欄位 (i.yarnType)
            const type = String(item.yarnType || item.yarn || '').trim();

            if (itemCustomer === custName && type) {
                // 統計件數或箱數 (packageCount / boxCount)
                const count = parseFloat(item.packageCount || item.boxCount || item.quantity || 1);
                yarnStockMap[type] = (yarnStockMap[type] || 0) + count;
            }
        });

        const availableYarns = Object.keys(yarnStockMap);

        if (availableYarns.length === 0) {
            container.innerHTML = `<span style="color: #ef4444; font-size: 0.85rem;">⚠️ 客戶「${custInput.value.trim()}」目前紗帳系統中尚無資料</span>`;
            return;
        }

        // 保留目前已經勾選的選項
        const selectedValues = Array.from(container.querySelectorAll('input[type="checkbox"]:checked')).map(cb => cb.value);

        container.innerHTML = "";
        availableYarns.forEach(y => {
            const label = document.createElement("label");
            label.className = "yarn-item";
            label.style.display = "inline-flex";
            label.style.alignItems = "center";
            label.style.marginRight = "12px";
            label.style.marginBottom = "6px";
            label.style.cursor = "pointer";

            const checked = selectedValues.includes(y) ? "checked" : "";
            const totalQty = yarnStockMap[y];

            label.innerHTML = `<input type="checkbox" value="${y}" ${checked} style="margin-right: 4px;"> ${y} <span style="color:#64748b; font-size:0.75rem; margin-left: 2px;">(${totalQty}件/箱)</span>`;
            container.appendChild(label);
        });
    }

    // 渲染訂單列表
    function renderTable() {
        const filterCustomer = document.getElementById("filterCustomer");
        const filterKeyword = document.getElementById("filterKeyword");
        const selectedCustomer = filterCustomer ? filterCustomer.value : "";
        const keyword = filterKeyword ? filterKeyword.value.toLowerCase().trim() : "";

        const tbody = document.getElementById("orderTableBody");
        if (!tbody) return;
        tbody.innerHTML = "";

        currentRenderedOrders = [];

        Object.keys(orderDataMap).forEach(key => {
            const item = orderDataMap[key];
            if (!item) return;

            const matchCustomer = !selectedCustomer || item.customerName === selectedCustomer;
            const matchKeyword = !keyword ||
                (item.customerName && item.customerName.toLowerCase().includes(keyword)) ||
                (item.fabricType && item.fabricType.toLowerCase().includes(keyword)) ||
                (item.yarnType && item.yarnType.toLowerCase().includes(keyword)) ||
                (item.color && item.color.toLowerCase().includes(keyword)) ||
                (item.dyeingFactory && item.dyeingFactory.toLowerCase().includes(keyword)) ||
                (item.remark && item.remark.toLowerCase().includes(keyword));

            if (matchCustomer && matchKeyword) {
                currentRenderedOrders.push({ key, ...item });
            }
        });

        currentRenderedOrders.sort((a,b) => new Date(b.orderDate) - new Date(a.orderDate));

        if (currentRenderedOrders.length === 0) {
            tbody.innerHTML = '<tr><td colspan="9" class="no-data" style="text-align:center; padding: 20px; color: #94a3b8;">目前無符合條件的訂單資料</td></tr>';
            return;
        }

        currentRenderedOrders.forEach(item => {
            const row = document.createElement("tr");

            const specs = [
                item.machineInch ? `${item.machineInch}` : '',
                item.machineNeedle ? `${item.machineNeedle}` : '',
                item.feederCount ? `${item.feederCount}口` : ''
            ].filter(Boolean).join(' / ') || '-';

            const colorDye = [
                item.color || '',
                item.dyeingFactory ? `(${item.dyeingFactory})` : ''
            ].filter(Boolean).join(' ') || '-';

            row.innerHTML = `
                <td><strong>${item.orderDate || "-"}</strong></td>
                <td><strong>${item.customerName || "-"}</strong></td>
                <td>${item.fabricType || "-"}<br><small style="color:#64748b">${item.widthWeight || ""}</small></td>
                <td>${specs}</td>
                <td>${item.yarnType || "-"}</td>
                <td><strong>${item.quantity || 0} kg</strong></td>
                <td>${colorDye}</td>
                <td>${item.remark || "-"}</td>
                <td>
                    <button class="btn-primary btn-edit" style="padding: 4px 8px; font-size: 0.85rem;" data-key="${item.key}">編輯</button>
                    <button class="btn-danger btn-del" style="padding: 4px 8px; font-size: 0.85rem;" data-key="${item.key}">刪除</button>
                </td>
            `;
            tbody.appendChild(row);
        });

        tbody.querySelectorAll(".btn-edit").forEach(btn => {
            btn.addEventListener("click", () => editOrder(btn.dataset.key));
        });
        tbody.querySelectorAll(".btn-del").forEach(btn => {
            btn.addEventListener("click", () => deleteOrder(btn.dataset.key));
        });
    }

    // 處理表單提交
    function handleFormSubmit(e) {
        e.preventDefault();

        const editKey = document.getElementById("editKey").value;

        const checkedYarns = Array.from(document.querySelectorAll('#yarnCheckboxGroup input[type="checkbox"]:checked'))
                                  .map(cb => cb.value);
        const customYarnInput = document.getElementById("yarnTypeCustom");
        const customYarn = customYarnInput ? customYarnInput.value.trim() : "";
        if (customYarn) checkedYarns.push(customYarn);
        const finalYarnType = checkedYarns.join('、');

        const orderData = {
            customerName: document.getElementById("customerName").value.trim(),
            orderDate: document.getElementById("orderDate").value,
            deliveryDate: document.getElementById("deliveryDate").value,
            fabricType: document.getElementById("fabricType").value.trim(),
            widthWeight: document.getElementById("widthWeight").value.trim(),
            machineInch: document.getElementById("machineInch").value.trim(),
            machineNeedle: document.getElementById("machineNeedle").value.trim(),
            feederCount: document.getElementById("feederCount").value.trim(),
            quantity: parseFloat(document.getElementById("quantity").value) || 0,
            yarnType: finalYarnType,
            color: document.getElementById("color").value.trim(),
            dyeingFactory: document.getElementById("dyeingFactory").value.trim(),
            remark: document.getElementById("remark").value.trim()
        };

        if (!editKey) {
            push(orderRef, orderData);
        } else {
            set(ref(db, `orderRecords/${editKey}`), orderData);
        }

        resetForm();
    }

    function editOrder(key) {
        const item = orderDataMap[key];
        if (!item) return;

        document.getElementById("editKey").value = key;
        document.getElementById("customerName").value = item.customerName || "";
        onCustomerChange();

        document.getElementById("orderDate").value = item.orderDate || "";
        document.getElementById("deliveryDate").value = item.deliveryDate || "";
        document.getElementById("fabricType").value = item.fabricType || "";
        document.getElementById("widthWeight").value = item.widthWeight || "";
        document.getElementById("machineInch").value = item.machineInch || "";
        document.getElementById("machineNeedle").value = item.machineNeedle || "";
        document.getElementById("feederCount").value = item.feederCount || "";
        document.getElementById("quantity").value = item.quantity || 0;
        document.getElementById("color").value = item.color || "";
        document.getElementById("dyeingFactory").value = item.dyeingFactory || "";
        document.getElementById("remark").value = item.remark || "";

        const selectedYarns = (item.yarnType || "").split('、');
        const checkboxes = document.querySelectorAll('#yarnCheckboxGroup input[type="checkbox"]');
        let remainingYarns = [...selectedYarns];

        checkboxes.forEach(cb => {
            if (selectedYarns.includes(cb.value)) {
                cb.checked = true;
                remainingYarns = remainingYarns.filter(y => y !== cb.value);
            }
        });

        const customInput = document.getElementById("yarnTypeCustom");
        if (customInput) customInput.value = remainingYarns.join('、');

        document.getElementById("formTitle").innerText = "✏️ 編輯訂單資料";
        document.getElementById("saveBtn").innerText = "更新訂單資料";
        document.getElementById("cancelBtn").style.display = "inline-flex";

        window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function deleteOrder(key) {
        if (confirm("確定要刪除這筆訂單資料嗎？")) {
            remove(ref(db, `orderRecords/${key}`));
        }
    }

    function resetForm() {
        const form = document.getElementById("orderForm");
        if (form) form.reset();
        document.getElementById("editKey").value = "";
        
        const dateInput = document.getElementById("orderDate");
        if (dateInput) dateInput.valueAsDate = new Date();

        document.getElementById("formTitle").innerText = "📝 新增訂單資料";
        document.getElementById("saveBtn").innerText = "儲存訂單資料";
        document.getElementById("cancelBtn").style.display = "none";
        onCustomerChange();
    }

    function exportOrdersToExcel() {
        if (currentRenderedOrders.length === 0) {
            alert("目前沒有訂單紀錄可供匯出！");
            return;
        }

        const excelData = currentRenderedOrders.map(item => ({
            "訂單日期": item.orderDate,
            "預計交期": item.deliveryDate || "",
            "客戶名稱": item.customerName,
            "布種/規格": item.fabricType,
            "幅寬/碼重": item.widthWeight || "",
            "機台吋數": item.machineInch || "",
            "機台針數": item.machineNeedle || "",
            "口數": item.feederCount || "",
            "數量(kg)": item.quantity,
            "紗種": item.yarnType || "",
            "顏色": item.color || "",
            "染整廠": item.dyeingFactory || "",
            "備註": item.remark || ""
        }));

        const worksheet = XLSX.utils.json_to_sheet(excelData);
        const workbook = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(workbook, worksheet, "訂單報表");

        const custSelect = document.getElementById("filterCustomer");
        const custLabel = (custSelect && custSelect.value) ? custSelect.value : "全部客戶";
        XLSX.writeFile(workbook, `德峰訂單報表_${custLabel}.xlsx`);
    }
</script>
