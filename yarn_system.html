<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>德峰紗帳進出管理系統</title>
    <!-- 載入 SheetJS 以支援 Excel 匯出 -->
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <style>
        :root {
            --primary: #2563eb;
            --primary-light: #3b82f6;
            --primary-hover: #1d4ed8;
            --success: #10b981;
            --success-hover: #059669;
            --danger: #ef4444;
            --danger-hover: #dc2626;
            --excel: #16a34a;
            --excel-hover: #15803d;
            --bg: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #0f172a;
            --text-sub: #475569;
            --border: #cbd5e1;
        }

        * {
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }

        body {
            background-color: var(--bg);
            color: var(--text-main);
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        .header {
            background: linear-gradient(135deg, var(--primary), var(--primary-light));
            color: white;
            padding: 16px 32px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .header h1 {
            margin: 0;
            font-size: 1.5rem;
            font-weight: 700;
        }

        .status-badge {
            background-color: #d1fae5;
            color: #065f46;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
        }

        .btn-switch-system {
            background-color: rgba(255, 255, 255, 0.2);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.5);
            padding: 8px 16px;
            border-radius: 8px;
            font-size: 0.9rem;
            font-weight: 600;
            text-decoration: none;
            transition: all 0.2s ease;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .btn-switch-system:hover {
            background-color: white;
            color: var(--primary);
            box-shadow: 0 2px 8px rgba(0,0,0,0.15);
        }

        .main-container {
            padding: 20px 24px;
            display: grid;
            grid-template-columns: 420px minmax(0, 1fr);
            gap: 20px;
            align-items: start;
        }

        @media (max-width: 1100px) {
            .main-container {
                grid-template-columns: 1fr;
            }
        }

        .card {
            background: var(--card-bg);
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05);
            border: 1px solid rgba(226, 232, 240, 0.8);
            margin-bottom: 20px;
        }

        .card-title {
            margin-top: 0;
            margin-bottom: 16px;
            color: var(--primary);
            font-size: 1.15rem;
            font-weight: 700;
            padding-bottom: 8px;
            border-bottom: 2px solid #f1f5f9;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 12px;
            margin-bottom: 20px;
        }

        .full-width {
            grid-column: span 2;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        label {
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text-sub);
        }

        input, select, textarea {
            width: 100%;
            padding: 9px 11px;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 0.9rem;
            outline: none;
            background-color: #f8fafc;
            box-sizing: border-box;
        }

        input:focus, select:focus, textarea:focus {
            border-color: var(--primary-light);
            background-color: #fff;
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.15);
        }

        .btn-group {
            display: flex;
            gap: 10px;
        }

        button {
            padding: 10px 18px;
            border: none;
            border-radius: 8px;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        .btn-primary { background-color: var(--primary-light); color: white; }
        .btn-primary:hover { background-color: var(--primary-hover); }

        .btn-success { background-color: var(--success); color: white; width: 100%; }
        .btn-success:hover { background-color: var(--success-hover); }

        .btn-excel { background-color: var(--excel); color: white; white-space: nowrap; }
        .btn-excel:hover { background-color: var(--excel-hover); }

        .btn-danger { background-color: var(--danger); color: white; padding: 4px 8px; font-size: 0.85rem; }
        .btn-danger:hover { background-color: var(--danger-hover); }

        .right-column {
            display: flex;
            flex-direction: column;
            gap: 20px;
            min-width: 0;
        }

        .filter-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 12px;
            align-items: end;
        }

        .action-btns {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            grid-column: span 2;
            margin-top: 8px;
        }

        .stats-bar {
            display: flex;
            gap: 16px;
            background: #f1f5f9;
            padding: 12px 16px;
            border-radius: 8px;
            margin-top: 12px;
            font-size: 0.9rem;
            font-weight: 600;
            color: var(--text-main);
            flex-wrap: wrap;
        }

        .stats-item span {
            color: var(--primary);
            font-size: 1.05rem;
        }

        .table-responsive {
            width: 100%;
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: separate;
            border-spacing: 0;
            text-align: left;
            font-size: 0.9rem;
        }

        th {
            background-color: #f8fafc;
            color: var(--text-sub);
            font-weight: 600;
            padding: 10px 12px;
            border-bottom: 2px solid var(--border);
            white-space: nowrap;
        }

        td {
            padding: 10px 12px;
            border-bottom: 1px solid var(--border);
            color: var(--text-main);
            vertical-align: middle;
            white-space: nowrap;
        }

        tbody tr:hover { background-color: #f8fafc; }

        .img-preview {
            width: 50px;
            height: 50px;
            object-fit: cover;
            border-radius: 6px;
            cursor: pointer;
            border: 1px solid var(--border);
        }

        .no-data { text-align: center; color: #94a3b8; padding: 32px; }

        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0; top: 0;
            width: 100%; height: 100%;
            background-color: rgba(0,0,0,0.8);
            justify-content: center;
            align-items: center;
        }

        .modal-content {
            max-width: 90%;
            max-height: 90%;
            border-radius: 8px;
        }
    </style>
</head>
<body>

<div class="header">
    <div class="header-left">
        <h1>🧶 德峰紗帳進出管理系統</h1>
        <span class="status-badge">🟢 雲端連線中</span>
    </div>
    <a href="index.html" class="btn-switch-system">📋 切換至訂單系統 ➔</a>
</div>

<div class="main-container">

    <!-- 左側表單 -->
    <div class="card">
        <h2 class="card-title" id="formTitle">📝 新增紗帳紀錄</h2>
        <form id="yarnForm">
            <input type="hidden" id="editKey" value="">
            <input type="hidden" id="imageDataBase64" value="">

            <div class="form-grid">
                
                <div class="form-group full-width">
                    <label for="recordDate">進紗日期</label>
                    <input type="date" id="recordDate" required>
                </div>

                <div class="form-group full-width">
                    <label for="customerName">客戶名稱</label>
                    <input type="text" id="customerName" list="customerDatalist" required placeholder="點選選單或輸入名稱..." onfocus="this.select()">
                    <datalist id="customerDatalist"></datalist>
                </div>

                <div class="form-group full-width">
                    <label for="yarnType">紗種</label>
                    <input type="text" id="yarnType" required placeholder="例如：30s 精梳棉">
                </div>

                <div class="form-group full-width">
                    <label for="yarnSupplier">紗商</label>
                    <input type="text" id="yarnSupplier" placeholder="例如：遠東紡織">
                </div>

                <div class="form-group">
                    <label for="packageCount">件數</label>
                    <input type="number" step="0.01" id="packageCount" placeholder="例如：1.25" oninput="autoCalcBoxCount()">
                </div>

                <div class="form-group">
                    <label for="boxCount">箱數</label>
                    <input type="number" step="0.01" id="boxCount" placeholder="例如：40" oninput="autoCalcPkgCount()">
                </div>

                <div class="form-group full-width">
                    <label for="yarnWeight">紗量 (kg)</label>
                    <input type="number" step="0.01" id="yarnWeight" required placeholder="例如：500">
                </div>

                <div class="form-group full-width">
                    <label for="yarnMill">導紗廠</label>
                    <input type="text" id="yarnMill" placeholder="例如：弘大導紗廠">
                </div>

                <div class="form-group full-width">
                    <label for="yarnImage">單據照片</label>
                    <input type="file" id="yarnImage" accept="image/*" onchange="handleImageUpload(event)">
                    <div id="imageUploadStatus" style="font-size:0.8rem; color:var(--text-sub); margin-top:4px;"></div>
                </div>

                <div class="form-group full-width">
                    <label for="remark">備註</label>
                    <textarea id="remark" rows="2" placeholder="備註說明、司機車號等..."></textarea>
                </div>

            </div>

            <div class="btn-group">
                <button type="submit" class="btn-success" id="saveBtn">儲存紗帳紀錄</button>
                <button type="button" class="btn-primary" id="cancelBtn" style="display:none; background-color: #64748b;" onclick="resetForm()">取消修改</button>
            </div>
        </form>
    </div>

    <!-- 右側列表與搜尋 -->
    <div class="right-column">
        
        <div class="card">
            <h2 class="card-title">🔍 紗帳紀錄查詢與統計</h2>
            <div class="filter-grid">
                <div class="form-group">
                    <label for="filterCustomer">依客戶篩選</label>
                    <select id="filterCustomer" onchange="renderTable()">
                        <option value="">-- 全部客戶 --</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="filterMonth">進紗月份篩選</label>
                    <input type="month" id="filterMonth" onchange="renderTable()">
                </div>
                <div class="form-group">
                    <label for="filterKeyword">關鍵字搜尋</label>
                    <input type="text" id="filterKeyword" placeholder="搜尋紗種、紗商、導紗廠..." oninput="renderTable()">
                </div>
                
                <div class="action-btns">
                    <button class="btn-excel" onclick="exportYarnToExcel()">📄 匯出當前視圖 Excel</button>
                    <button class="btn-excel" style="background-color:#0284c7;" onclick="exportYearlyMonthlyExcel()">📊 匯出整年分月 Excel 報表</button>
                </div>
            </div>

            <!-- 月份/條件 統計結果 -->
            <div class="stats-bar" id="statsBar">
                <div class="stats-item">總筆數：<span id="statCount">0</span> 筆</div>
                <div class="stats-item">總件數：<span id="statPkg">0</span> 件</div>
                <div class="stats-item">總箱數：<span id="statBox">0</span> 箱</div>
                <div class="stats-item">總紗量：<span id="statWeight">0</span> kg</div>
            </div>
        </div>

        <div class="card">
            <h2 class="card-title">📊 紗帳歷史明細清單</h2>
            <div class="table-responsive">
                <table>
                    <thead>
                        <tr>
                            <th>進紗日期</th>
                            <th>客戶名稱</th>
                            <th>紗種</th>
                            <th>紗商</th>
                            <th>件數</th>
                            <th>箱數</th>
                            <th>紗量 (kg)</th>
                            <th>導紗廠</th>
                            <th>單據照片</th>
                            <th>備註</th>
                            <th>操作</th>
                        </tr>
                    </thead>
                    <tbody id="yarnTableBody">
                        <tr><td colspan="11" class="no-data">載入紗帳資料中...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>

    </div>

</div>

<!-- 圖片放大 Modal -->
<div id="imageModal" class="modal" onclick="closeModal()">
    <img id="modalImg" class="modal-content" src="" alt="單據放大預覽">
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, push, set, remove, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const firebaseConfig = {
        apiKey: "AIzaSyAR1sHUr3Yx6z2-EdPxvnKk50X4XL0-wR4",
        authDomain: "defong-ab039.firebaseapp.com",
        databaseURL: "https://defong-ab039-default-rtdb.firebaseio.com",
        projectId: "defong-ab039",
        storageBucket: "defong-ab039.firebasestorage.app",
        messagingSenderId: "751338216702",
        appId: "1:751338216702:web:1892c102b6565c8543d9af",
        measurementId: "G-ZTV82ZDYSV"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    
    const yarnRef = ref(db, 'yarnRecords');   
    const orderRef = ref(db, 'orderRecords'); 

    let yarnDataMap = {};
    let orderDataMap = {};
    let currentRenderedYarn = [];

    window.onload = function() {
        document.getElementById("recordDate").valueAsDate = new Date();
    };

    onValue(yarnRef, (snapshot) => {
        yarnDataMap = snapshot.val() || {};
        updateCustomerDropdowns();
        renderTable();
    });

    onValue(orderRef, (snapshot) => {
        orderDataMap = snapshot.val() || {};
        updateCustomerDropdowns();
    });

    // 自動換算箱數（小數點後兩位）
    window.autoCalcBoxCount = function() {
        const pkg = parseFloat(document.getElementById("packageCount").value);
        if (!isNaN(pkg)) {
            document.getElementById("boxCount").value = (pkg * 4).toFixed(2);
        }
    };

    // 自動換算件數（小數點後兩位）
    window.autoCalcPkgCount = function() {
        const box = parseFloat(document.getElementById("boxCount").value);
        if (!isNaN(box)) {
            document.getElementById("packageCount").value = (box / 4).toFixed(2);
        }
    };

    function updateCustomerDropdowns() {
        const customers = new Set();
        Object.values(yarnDataMap).forEach(i => i.customerName && customers.add(i.customerName.trim()));
        Object.values(orderDataMap).forEach(i => i.customerName && customers.add(i.customerName.trim()));

        const sortedCustomers = Array.from(customers).sort();

        const datalist = document.getElementById("customerDatalist");
        datalist.innerHTML = "";
        sortedCustomers.forEach(c => {
            const opt = document.createElement("option");
            opt.value = c;
            datalist.appendChild(opt);
        });

        const filterSelect = document.getElementById("filterCustomer");
        const currentVal = filterSelect.value;
        filterSelect.innerHTML = '<option value="">-- 全部客戶 --</option>';
        sortedCustomers.forEach(c => {
            const opt = document.createElement("option");
            opt.value = c;
            opt.textContent = c;
            filterSelect.appendChild(opt);
        });
        filterSelect.value = currentVal;
    }

    window.handleImageUpload = function(event) {
        const file = event.target.files[0];
        const statusDiv = document.getElementById("imageUploadStatus");
        if (!file) return;

        statusDiv.innerText = "⏳ 圖片處理中...";

        const reader = new FileReader();
        reader.onload = function(e) {
            const img = new Image();
            img.onload = function() {
                const canvas = document.createElement("canvas");
                const MAX_WIDTH = 1000;
                let width = img.width;
                let height = img.height;

                if (width > MAX_WIDTH) {
                    height *= MAX_WIDTH / width;
                    width = MAX_WIDTH;
                }

                canvas.width = width;
                canvas.height = height;
                const ctx = canvas.getContext("2d");
                ctx.drawImage(img, 0, 0, width, height);

                const base64Str = canvas.toDataURL("image/jpeg", 0.7);
                document.getElementById("imageDataBase64").value = base64Str;
                statusDiv.innerText = "✅ 照片處理完成";
            };
            img.src = e.target.result;
        };
        reader.readAsDataURL(file);
    };

    window.renderTable = function() {
        const selectedCustomer = document.getElementById("filterCustomer").value;
        const selectedMonth = document.getElementById("filterMonth").value; // YYYY-MM
        const keyword = document.getElementById("filterKeyword").value.toLowerCase().trim();
        const tbody = document.getElementById("yarnTableBody");
        tbody.innerHTML = "";

        currentRenderedYarn = [];

        Object.keys(yarnDataMap).forEach(key => {
            const item = yarnDataMap[key];
            const matchCustomer = !selectedCustomer || item.customerName === selectedCustomer;
            const matchMonth = !selectedMonth || (item.recordDate && item.recordDate.startsWith(selectedMonth));
            const matchKeyword = !keyword ||
                (item.customerName && item.customerName.toLowerCase().includes(keyword)) ||
                (item.yarnType && item.yarnType.toLowerCase().includes(keyword)) ||
                (item.yarnSupplier && item.yarnSupplier.toLowerCase().includes(keyword)) ||
                (item.yarnMill && item.yarnMill.toLowerCase().includes(keyword)) ||
                (item.remark && item.remark.toLowerCase().includes(keyword));

            if (matchCustomer && matchMonth && matchKeyword) {
                currentRenderedYarn.push({ key, ...item });
            }
        });

        currentRenderedYarn.sort((a,b) => new Date(b.recordDate) - new Date(a.recordDate));

        // 計算統計數字
        let totalPkg = 0;
        let totalBox = 0;
        let totalWeight = 0;

        currentRenderedYarn.forEach(item => {
            totalPkg += parseFloat(item.packageCount) || 0;
            totalBox += parseFloat(item.boxCount) || 0;
            totalWeight += parseFloat(item.yarnWeight) || 0;
        });

        document.getElementById("statCount").innerText = currentRenderedYarn.length;
        document.getElementById("statPkg").innerText = totalPkg.toFixed(2);
        document.getElementById("statBox").innerText = totalBox.toFixed(2);
        document.getElementById("statWeight").innerText = totalWeight.toFixed(2);

        if (currentRenderedYarn.length === 0) {
            tbody.innerHTML = '<tr><td colspan="11" class="no-data">目前無符合條件的紗帳資料</td></tr>';
            return;
        }

        currentRenderedYarn.forEach(item => {
            const pkg = (item.packageCount !== "" && item.packageCount !== undefined) ? `${item.packageCount} 件` : "-";
            const box = (item.boxCount !== "" && item.boxCount !== undefined) ? `${item.boxCount} 箱` : "-";

            const imgHtml = item.image 
                ? `<img src="${item.image}" class="img-preview" onclick="openModal('${item.image}')">`
                : `<span style="color:#94a3b8;">無照片</span>`;

            const row = document.createElement("tr");
            row.innerHTML = `
                <td><strong>${item.recordDate || "-"}</strong></td>
                <td><strong>${item.customerName || "-"}</strong></td>
                <td>${item.yarnType || "-"}</td>
                <td>${item.yarnSupplier || item.yarnBatch || "-"}</td>
                <td>${pkg}</td>
                <td>${box}</td>
                <td><strong>${item.yarnWeight || 0} kg</strong></td>
                <td>${item.yarnMill || "-"}</td>
                <td>${imgHtml}</td>
                <td>${item.remark || "-"}</td>
                <td>
                    <button class="btn-primary" style="padding: 4px 8px; font-size: 0.85rem;" onclick="editYarn('${item.key}')">編輯</button>
                    <button class="btn-danger" onclick="deleteYarn('${item.key}')">刪除</button>
                </td>
            `;
            tbody.appendChild(row);
        });
    };

    document.getElementById("yarnForm").addEventListener("submit", function(e) {
        e.preventDefault();

        const editKey = document.getElementById("editKey").value;
        const newImageBase64 = document.getElementById("imageDataBase64").value;

        const yarnData = {
            recordDate: document.getElementById("recordDate").value,
            customerName: document.getElementById("customerName").value.trim(),
            yarnType: document.getElementById("yarnType").value.trim(),
            yarnSupplier: document.getElementById("yarnSupplier").value.trim(),
            packageCount: document.getElementById("packageCount").value ? parseFloat(document.getElementById("packageCount").value) : "",
            boxCount: document.getElementById("boxCount").value ? parseFloat(document.getElementById("boxCount").value) : "",
            yarnWeight: parseFloat(document.getElementById("yarnWeight").value) || 0,
            yarnMill: document.getElementById("yarnMill").value.trim(),
            remark: document.getElementById("remark").value.trim(),
            image: newImageBase64 || (editKey && yarnDataMap[editKey] ? (yarnDataMap[editKey].image || "") : "")
        };

        if (!editKey) {
            push(yarnRef, yarnData);
        } else {
            set(ref(db, `yarnRecords/${editKey}`), yarnData);
        }

        resetForm();
    });

    window.editYarn = function(key) {
        const item = yarnDataMap[key];
        if (!item) return;

        document.getElementById("editKey").value = key;
        document.getElementById("recordDate").value = item.recordDate || "";
        document.getElementById("customerName").value = item.customerName || "";
        document.getElementById("yarnType").value = item.yarnType || "";
        document.getElementById("yarnSupplier").value = item.yarnSupplier || item.yarnBatch || "";
        document.getElementById("packageCount").value = item.packageCount ?? "";
        document.getElementById("boxCount").value = item.boxCount ?? "";
        document.getElementById("yarnWeight").value = item.yarnWeight || "";
        document.getElementById("yarnMill").value = item.yarnMill || "";
        document.getElementById("remark").value = item.remark || "";
        document.getElementById("imageDataBase64").value = ""; 

        document.getElementById("formTitle").innerText = "✏️ 編輯紗帳紀錄";
        document.getElementById("saveBtn").innerText = "更新紗帳紀錄";
        document.getElementById("cancelBtn").style.display = "inline-flex";

        window.scrollTo({ top: 0, behavior: 'smooth' });
    };

    window.deleteYarn = function(key) {
        const item = yarnDataMap[key];
        const label = item ? `${item.customerName} - ${item.yarnType}` : "這筆";
        if (confirm(`確定要刪除「${label}」的紗帳紀錄嗎？`)) {
            remove(ref(db, `yarnRecords/${key}`));
        }
    };

    window.resetForm = function() {
        document.getElementById("yarnForm").reset();
        document.getElementById("editKey").value = "";
        document.getElementById("imageDataBase64").value = "";
        document.getElementById("imageUploadStatus").innerText = "";
        document.getElementById("recordDate").valueAsDate = new Date();
        document.getElementById("formTitle").innerText = "📝 新增紗帳紀錄";
        document.getElementById("saveBtn").innerText = "儲存紗帳紀錄";
        document.getElementById("cancelBtn").style.display = "none";
    };

    window.openModal = function(imgSrc) {
        document.getElementById("modalImg").src = imgSrc;
        document.getElementById("imageModal").style.display = "flex";
    };

    window.closeModal = function() {
        document.getElementById("imageModal").style.display = "none";
    };

    // 輔助函數：自動計算 Sheet 欄位寬度（防止 Excel 字體被覆蓋）
    function setWorksheetColWidths(worksheet, jsonData) {
        if (!jsonData || jsonData.length === 0) return;
        
        const keys = Object.keys(jsonData[0]);
        const colWidths = keys.map(key => {
            // 計算標頭長度 (中文字約佔 2 個字元長度)
            let maxLen = 0;
            for (let char of key) {
                maxLen += char.charCodeAt(0) > 255 ? 2.1 : 1.1;
            }

            // 計算資料內文最長度
            jsonData.forEach(row => {
                const val = row[key] !== null && row[key] !== undefined ? String(row[key]) : "";
                let valLen = 0;
                for (let char of val) {
                    valLen += char.charCodeAt(0) > 255 ? 2.1 : 1.1;
                }
                if (valLen > maxLen) maxLen = valLen;
            });

            // 設定最小與最大寬度保護機制
            return { wch: Math.min(Math.max(Math.ceil(maxLen) + 3, 10), 60) };
        });

        worksheet['!cols'] = colWidths;
    }

    // 匯出目前篩選結果
    window.exportYarnToExcel = function() {
        if (currentRenderedYarn.length === 0) {
            alert("目前沒有紗帳紀錄可供匯出！");
            return;
        }

        const excelData = currentRenderedYarn.map(item => ({
            "進紗日期": item.recordDate || "",
            "客戶名稱": item.customerName || "",
            "紗種": item.yarnType || "",
            "紗商": item.yarnSupplier || item.yarnBatch || "",
            "件數": item.packageCount ?? "",
            "箱數": item.boxCount ?? "",
            "紗量 (kg)": item.yarnWeight || 0,
            "導紗廠": item.yarnMill || "",
            "備註": item.remark || ""
        }));

        const worksheet = XLSX.utils.json_to_sheet(excelData);
        setWorksheetColWidths(worksheet, excelData); // 自動設定欄寬

        const workbook = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(workbook, worksheet, "紗帳報表");

        const custLabel = document.getElementById("filterCustomer").value || "全部客戶";
        const monthLabel = document.getElementById("filterMonth").value || "全時期";
        XLSX.writeFile(workbook, `德峰紗帳報表_${custLabel}_${monthLabel}.xlsx`);
    };

    // 匯出整年分月 Excel 報表
    window.exportYearlyMonthlyExcel = function() {
        const selectedCustomer = document.getElementById("filterCustomer").value;
        const filterMonthVal = document.getElementById("filterMonth").value;
        let targetYear = filterMonthVal ? filterMonthVal.split("-")[0] : new Date().getFullYear().toString();

        const yearInput = prompt("請輸入要匯出的年份（YYYY）：", targetYear);
        if (!yearInput) return;
        targetYear = yearInput.trim();

        // 收集該年份所有符合客戶資格的資料
        const yearRecords = [];
        Object.values(yarnDataMap).forEach(item => {
            const matchCustomer = !selectedCustomer || item.customerName === selectedCustomer;
            const matchYear = item.recordDate && item.recordDate.startsWith(targetYear);
            if (matchCustomer && matchYear) {
                yearRecords.push(item);
            }
        });

        if (yearRecords.length === 0) {
            alert(`在 ${targetYear} 年找不到符合條件的紗帳紀錄！`);
            return;
        }

        const workbook = XLSX.utils.book_new();
        const monthlySummary = [];
        const monthSheets = [];

        // 按月份拆分 (01 ~ 12)
        for (let m = 1; m <= 12; m++) {
            const monthStr = m.toString().padStart(2, '0');
            const monthKey = `${targetYear}-${monthStr}`;

            const monthData = yearRecords.filter(item => item.recordDate && item.recordDate.startsWith(monthKey));
            monthData.sort((a,b) => new Date(a.recordDate) - new Date(b.recordDate));

            let mPkg = 0, mBox = 0, mWeight = 0;

            const excelRows = monthData.map(item => {
                mPkg += parseFloat(item.packageCount) || 0;
                mBox += parseFloat(item.boxCount) || 0;
                mWeight += parseFloat(item.yarnWeight) || 0;
                return {
                    "進紗日期": item.recordDate || "",
                    "客戶名稱": item.customerName || "",
                    "紗種": item.yarnType || "",
                    "紗商": item.yarnSupplier || item.yarnBatch || "",
                    "件數": item.packageCount ?? "",
                    "箱數": item.boxCount ?? "",
                    "紗量 (kg)": item.yarnWeight || 0,
                    "導紗廠": item.yarnMill || "",
                    "備註": item.remark || ""
                };
            });

            monthlySummary.push({
                "月份": `${m} 月`,
                "筆數": monthData.length,
                "總件數": mPkg ? mPkg.toFixed(2) : 0,
                "總箱數": mBox ? mBox.toFixed(2) : 0,
                "總紗量 (kg)": mWeight ? mWeight.toFixed(2) : 0
            });

            if (excelRows.length > 0) {
                const worksheet = XLSX.utils.json_to_sheet(excelRows);
                setWorksheetColWidths(worksheet, excelRows); // 自動設定欄寬
                monthSheets.push({ name: `${monthStr}月`, sheet: worksheet });
            }
        }

        // 先把「全年度統計摘要」作為第一個工作表 append 進去
        const summaryWorksheet = XLSX.utils.json_to_sheet(monthlySummary);
        setWorksheetColWidths(summaryWorksheet, monthlySummary); // 自動設定欄寬
        XLSX.utils.book_append_sheet(workbook, summaryWorksheet, "全年度統計摘要");

        // 依序 append 各月份工作表
        monthSheets.forEach(m => {
            XLSX.utils.book_append_sheet(workbook, m.sheet, m.name);
        });

        const custLabel = selectedCustomer || "全部客戶";
        XLSX.writeFile(workbook, `德峰紗帳分月報表_${targetYear}年_${custLabel}.xlsx`);
    };
</script>
